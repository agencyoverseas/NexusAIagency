function ldFiltered() {
  var q = LD.q.trim().toLowerCase();
  var lim = 0;
  if (LD.periode === "7") lim = Date.now() - 7 * 864e5;
  else if (LD.periode === "30") lim = Date.now() - 30 * 864e5;
  return LD.rows.filter(function (r) {
    if (q && String(r.email).toLowerCase().indexOf(q) < 0) return false;
    if (LD.statut && (r.status || "todo") !== LD.statut) return false;
    if (lim && Date.parse(r.created_at) < lim) return false;
    return true;
  });
}

function ldRender() {
  var el = document.getElementById("leadsBody"); if (!el) return;
  var s = LD.stats || {};
  var conv = s.total ? Math.round((s.clientes / s.total) * 100) : 0;
  var rows = ldFiltered();

  var stats = '<div class="ld-stats">'
    + '<div class="ld-st"><b>' + (s.total || 0) + "</b><span>Collectés</span></div>"
    + '<div class="ld-st"><b>' + (s.contactes || 0) + "</b><span>Contactés</span></div>"
    + '<div class="ld-st"><b>' + (s.clientes || 0) + "</b><span>Clientes</span></div>"
    + '<div class="ld-st"><b>' + conv + " %</b><span>Conversion</span></div></div>";

  var outils = '<div class="ld-tools">'
    + '<input id="ld_q" type="search" placeholder="Rechercher un e-mail…" value="' + ldEsc(LD.q) + '" oninput="LD.q=this.value;ldRender()">'
    + '<select onchange="LD.statut=this.value;ldRender()">'
    + '<option value="">Tous les statuts</option>'
    + Object.keys(LD_STATUTS).map(function (k) { return '<option value="' + k + '"' + (LD.statut === k ? " selected" : "") + ">" + LD_STATUTS[k] + "</option>"; }).join("")
    + "</select>"
    + '<select onchange="LD.periode=this.value;ldRender()">'
    + '<option value="">Toute période</option>'
    + '<option value="7"' + (LD.periode === "7" ? " selected" : "") + ">7 derniers jours</option>"
    + '<option value="30"' + (LD.periode === "30" ? " selected" : "") + ">30 derniers jours</option>"
    + "</select></div>"
    + '<div class="ld-tools">'
    + '<button class="ld-btn dark" onclick="ldExport()">Export CSV</button>'
    + '<button class="ld-btn" onclick="ldAdd()">+ Ajouter</button>'
    + '<button class="ld-btn red" onclick="ldBulk()">Envoi groupé</button>'
    + '<button class="ld-btn" onclick="ldTemplates()">Modèles de mail</button></div>';

  var liste = rows.length
    ? rows.map(function (r) {
        var meta = ldDate(r.created_at) + " · " + ldEsc(r.source || "—")
          + (r.email_count ? " · " + r.email_count + " envoi(s)" : "");
        var pills = (r.is_client ? '<span class="ld-pill cli">Cliente</span>' : "")
          + (r.unsubscribed ? '<span class="ld-pill off">Désinscrite</span>' : "");
        var sel = r.unsubscribed
          ? '<span class="ld-mut">clos</span>'
          : '<select class="ld-sel" onchange="ldStatus(\'' + r.id + "',this.value)\">"
            + Object.keys(LD_STATUTS).map(function (k) { return '<option value="' + k + '"' + ((r.status || "todo") === k ? " selected" : "") + ">" + LD_STATUTS[k] + "</option>"; }).join("")
            + "</select>";
        return '<div class="ld-row"><div class="ld-left">'
          + '<div class="ld-mail">' + ldEsc(r.email) + "</div>"
          + '<div class="ld-meta">' + meta + "</div></div>"
          + '<div class="ld-right">' + pills + sel
          + '<div class="ld-acts">'
          + (r.unsubscribed ? "" : '<button class="ld-mini" onclick="ldOne(\'' + r.id + "','" + ldEsc(r.email) + '\')">Écrire</button>')
          + '<button class="ld-mini danger" onclick="ldDel(\'' + r.id + "','" + ldEsc(r.email) + '\')">Suppr.</button>'
          + "</div></div></div>";
      }).join("")
    : '<div class="muted">Aucun lead ne correspond.</div>';

  el.innerHTML = stats + outils + '<div class="ld-list">' + liste + "</div>"
    + '<div class="ld-note">Les envois excluent automatiquement les désinscrites et toute personne relancée depuis moins de 7 jours.</div>';

  var qi = document.getElementById("ld_q");
  if (qi && LD.q) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
}

async function ldStatus(id, v) {
  try { await leadsApi("set_status", { id: id, status: v });
    var r = LD.rows.filter(function (x) { return x.id === id; })[0]; if (r) r.status = v;
  } catch (e) { alert(e.message); }
}

async function ldAdd() {
  var e = prompt("Adresse e-mail à ajouter :");
  if (!e) return;
  try { await leadsApi("add", { email: e }); loadLeads(); }
  catch (err) { alert(err.message); }
}
async function ldDel(id, email) {
  if (!confirm("Supprimer définitivement " + email + " ?\n\nÀ utiliser notamment pour une demande d'effacement RGPD.")) return;
  try { await leadsApi("delete", { id: id }); loadLeads(); }
  catch (e) { alert(e.message); }
}

function ldExport() {
  var rows = LD.rows;
  if (!rows.length) { alert("Aucun lead à exporter."); return; }
  var head = ["E-mail", "Date", "Source", "Statut", "Cliente", "Desinscrite", "Envois"];
  var cell = function (v) { var s = String(v == null ? "" : v); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  var lignes = [head.join(";")].concat(rows.map(function (r) {
    return [cell(r.email), cell(ldDate(r.created_at)), cell(r.source || ""),
      cell(LD_STATUTS[r.status || "todo"]), cell(r.is_client ? "oui" : "non"),
      cell(r.unsubscribed ? "oui" : "non"), cell(r.email_count || 0)].join(";");
  }));
  var blob = new Blob(["\ufeff" + lignes.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "leads-guide-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
}

/* ---------- Modeles de mail ---------- */
function ldTplGet(which) {
  return {
    subject: LD.tpl["leads_tpl_" + which + "_subject"] || "",
    body: LD.tpl["leads_tpl_" + which + "_body"] || "",
  };
}
function ldTemplates() {
  var t = ldTplGet(LD.which);
  ldOpen('<h3>Modèles de mail</h3>'
    + '<div class="ld-tools"><button class="ld-btn ' + (LD.which === "soft" ? "dark" : "") + '" onclick="LD.which=\'soft\';ldTemplates()">Relance douce</button>'
    + '<button class="ld-btn ' + (LD.which === "promo" ? "dark" : "") + '" onclick="LD.which=\'promo\';ldTemplates()">Offre promo</button></div>'
    + '<label class="ld-lab">Objet</label><input id="ld_s" type="text" value="' + ldEsc(t.subject) + '">'
    + '<label class="ld-lab">Message</label><textarea id="ld_b" rows="9">' + ldEsc(t.body) + "</textarea>"
    + '<div class="ld-note">Le bloc d\'identification et le lien de désinscription sont ajoutés automatiquement en bas de chaque envoi.</div>'
    + '<div class="ld-foot">' + '<button class="ld-btn" onclick="closeSheet(this)">Fermer</button>'
    + '<button class="ld-btn dark" onclick="ldTplSave(this)">Enregistrer</button></div>');
}
async function ldTplSave(btn) {
  btn.disabled = true;
  try {
    var s = document.getElementById("ld_s").value, b = document.getElementById("ld_b").value;
    await leadsApi("save_template", { which: LD.which, subject: s, bodytext: b });
    LD.tpl["leads_tpl_" + LD.which + "_subject"] = s;
    LD.tpl["leads_tpl_" + LD.which + "_body"] = b;
    ldDone("Modèle enregistré.");
  } catch (e) { alert(e.message); btn.disabled = false; }
}

/* ---------- Envoi individuel ---------- */
function ldOne(id, email) {
  var t = ldTplGet(LD.which);
  ldOpen('<h3>Écrire à ' + ldEsc(email) + "</h3>"
    + '<div class="ld-tools"><button class="ld-btn ' + (LD.which === "soft" ? "dark" : "") + '" onclick="LD.which=\'soft\';ldOne(\'' + id + "','" + ldEsc(email) + '\')">Relance douce</button>'
    + '<button class="ld-btn ' + (LD.which === "promo" ? "dark" : "") + '" onclick="LD.which=\'promo\';ldOne(\'' + id + "','" + ldEsc(email) + '\')">Offre promo</button></div>'
    + '<label class="ld-lab">Objet</label><input id="ld_s" type="text" value="' + ldEsc(t.subject) + '">'
    + '<label class="ld-lab">Message</label><textarea id="ld_b" rows="8">' + ldEsc(t.body) + "</textarea>"
    + '<div class="ld-foot">' + '<button class="ld-btn" onclick="closeSheet(this)">Fermer</button>'
    + '<button class="ld-btn red" onclick="ldSend(this,[\'' + id + "'])\">Envoyer</button></div>");
}

/* ---------- Envoi groupe ---------- */
async function ldBulk() {
  ldOpen("<h3>Envoi groupé</h3><div class=\"muted\">Calcul des destinataires…</div>");
  try {
    var p = await leadsApi("preview", { filter: LD.statut || "todo" });
    var t = ldTplGet(LD.which);
    LD._cibles = p.cibles.map(function (c) { return c.id; });
    ldOpen("<h3>Envoi groupé</h3>"
      + '<div class="ld-tools"><button class="ld-btn ' + (LD.which === "soft" ? "dark" : "") + '" onclick="LD.which=\'soft\';ldBulk()">Relance douce</button>'
      + '<button class="ld-btn ' + (LD.which === "promo" ? "dark" : "") + '" onclick="LD.which=\'promo\';ldBulk()">Offre promo</button></div>'
      + '<label class="ld-lab">Objet</label><input id="ld_s" type="text" value="' + ldEsc(t.subject) + '">'
      + '<label class="ld-lab">Message</label><textarea id="ld_b" rows="7">' + ldEsc(t.body) + "</textarea>"
      + '<div class="ld-warn"><b>' + p.nb + " destinataire(s)</b><br>"
      + p.desinscrits + " désinscrite(s) exclue(s) · " + p.recents + " relancée(s) récemment, écartée(s)<br>"
      + "→ " + p.lots + " lot(s) de " + p.taille_lot + " maximum</div>"
      + '<div class="ld-foot">' + '<button class="ld-btn" onclick="closeSheet(this)">Fermer</button>'
      + (p.nb ? '<button class="ld-btn red" onclick="ldSendBulk(this)">Envoyer aux ' + p.nb + "</button>" : "")
      + "</div>");
  } catch (e) { ldOpen('<h3>Envoi groupé</h3><div class="ld-err">' + ldEsc(e.message) + "</div>" + '<div class="ld-foot">' + '<button class="ld-btn" onclick="closeSheet(this)">Fermer</button>' + "</div>"); }
}

async function ldSend(btn, ids) {
  btn.disabled = true; btn.textContent = "Envoi…";
  try {
    var j = await leadsApi("send", {
      ids: ids, which: LD.which,
      subject: document.getElementById("ld_s").value,
      bodytext: document.getElementById("ld_b").value,
    });
    ldDone(j.envoyes + " envoyé(s), " + j.ignores + " écarté(s), " + j.echecs + " échec(s).");
    loadLeads();
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = "Envoyer"; }
}

/* L'envoi part par lots de 20, avec une pause : au-dela, Gmail filtre. */
async function ldSendBulk(btn) {
  var ids = LD._cibles || [];
  var subject = document.getElementById("ld_s").value;
  var bodytext = document.getElementById("ld_b").value;
  var envoyes = 0, ignores = 0, echecs = 0;
  btn.disabled = true;
  for (var i = 0; i < ids.length; i += 20) {
    var lot = ids.slice(i, i + 20);
    btn.textContent = "Envoi " + (i + lot.length) + " / " + ids.length + "…";
    try {
      var j = await leadsApi("send", { ids: lot, which: LD.which, subject: subject, bodytext: bodytext });
      envoyes += j.envoyes; ignores += j.ignores; echecs += j.echecs;
    } catch (e) { echecs += lot.length; }
    if (i + 20 < ids.length) await new Promise(function (r) { setTimeout(r, 2000); });
  }
  ldDone(envoyes + " envoyé(s), " + ignores + " écarté(s), " + echecs + " échec(s).");
  loadLeads();
}

</script>



<!-- ===== Mise a jour automatique — Locks by Afro (ne pas dupliquer) ===== -->
<script>
(function(){
  var CFG = window.LBA_CONFIG || {};
  var CHECK_MS = 60000;      /* frequence de verification */
  var IDLE_MS  = 90000;      /* inactivite requise avant un rechargement silencieux */
  var codeSeen = null, contentSeen = null;
  var pending = false, busy = false, lastAct = Date.now();

  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ lastAct = Date.now(); }, {passive:true, capture:true});
  });

  /* ---------- 1. Nouveau code en ligne -> ecran bloquant + purge ---------- */
  function purge(remote){
    if (busy) return; busy = true;
    var finish = function(){
      try { localStorage.clear(); } catch(e){}
      try { sessionStorage.clear(); } catch(e){}
      try {
        document.cookie.split(';').forEach(function(c){
          var name = c.split('=')[0].trim(); if(!name) return;
          ['/', location.pathname].forEach(function(p){
            ['', location.hostname, '.' + location.hostname].forEach(function(h){
              document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=' + p + (h ? ';domain=' + h : '');
            });
          });
        });
      } catch(e){}
      var u;
      try { u = new URL(location.href); u.searchParams.set('v', remote || Date.now()); u = u.toString(); }
      catch(e){ u = location.pathname + '?v=' + (remote || Date.now()); }
      location.replace(u);
    };
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return caches.delete(k); }));
    }).catch(function(){}));
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    }).catch(function(){}));
    Promise.all(jobs).then(finish, finish);
    setTimeout(finish, 4000);
  }

  function banner(remote){
    if (document.getElementById('lbaUpd')) return;
    var d = document.createElement('div');
    d.id = 'lbaUpd';
    d.setAttribute('style','position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;background:rgba(22,19,15,.93);display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,\'Segoe UI\',Roboto,sans-serif');
    d.innerHTML =
      '<div style="max-width:420px;width:100%;background:#fff;border-radius:16px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)">'
      + '<div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6B4A33;font-weight:700">Locks by Afro</div>'
      + '<h2 style="margin:8px 0 10px;font-size:20px;color:#16130F">Mise a jour disponible</h2>'
      + '<p style="margin:0 0 18px;font-size:15px;line-height:1.5;color:#4a443c">Une nouvelle version du site vient d\'etre mise en ligne. Mets a jour pour continuer.<br><span style="color:#857E72;font-size:13px">Tu devras te reconnecter apres la mise a jour.</span></p>'
      + '<button id="lbaUpdBtn" style="width:100%;border:0;border-radius:12px;padding:15px 18px;background:#D81E2C;color:#fff;font-size:16px;font-weight:700;cursor:pointer">Mettre a jour</button>'
      + '</div>';
    document.body.appendChild(d);
    var b = document.getElementById('lbaUpdBtn');
    b.onclick = function(){ b.disabled = true; b.textContent = 'Mise a jour\u2026'; purge(remote); };
  }

  function checkCode(){
    return fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j || !j.version) return;
        if (codeSeen === null) { codeSeen = j.version; return; }   /* 1er passage : on memorise */
        if (j.version !== codeSeen) banner(j.version);
      }).catch(function(){});
  }

  /* ---------- 2. Contenu modifie dans l'admin -> rafraichissement silencieux ---------- */
  function screenBusy(){
    if (document.getElementById('lbaUpd')) return true;
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
    /* Correction 31/07/2026 : offsetParent vaut TOUJOURS null pour un element
       en position:fixed, donc l'ancien test ne detectait jamais rien. On teste
       desormais la visibilite reelle et la presence a l'ecran. */
    var open = document.querySelectorAll('.sheet, .sheet-bg, #modal, dialog[open]');
    for (var i = 0; i < open.length; i++) {
      var el = open[i];
      /* Panier docke sur grand ecran : visible en permanence, il ne bloque pas. */
      if (el.id === 'cart' && typeof window.LBA_DOCK === 'function' && window.LBA_DOCK()) continue;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) continue;
      var r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      /* Feuille repliee hors ecran ou fenetre fermee : on ignore. */
      if (r.bottom <= 1 || r.right <= 1) continue;
      if (r.top >= (window.innerHeight - 1) || r.left >= (window.innerWidth - 1)) continue;
      return true;
    }
    return false;
  }

  function applyContent(){
    if (!pending || busy) return;
    if (typeof window.LBA_REFRESH === 'function') {      /* hook optionnel fourni par la page */
      try { window.LBA_REFRESH(); pending = false; return; } catch(e){}
    }
    if (document.hidden) { busy = true; location.reload(); return; }
    if (!screenBusy() && (Date.now() - lastAct) > IDLE_MS) { busy = true; location.reload(); }
  }

  function checkContent(){
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return;
    return fetch(CFG.SUPABASE_URL + '/rest/v1/content_meta?id=eq.1&select=version', {
      cache: 'no-store',
      headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY }
    })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(rows){
        var v = rows && rows[0] && rows[0].version;
        if (!v) return;
        if (contentSeen === null) { contentSeen = v; return; }
        if (v !== contentSeen) { contentSeen = v; pending = true; applyContent(); }
      }).catch(function(){});
  }

  function tick(){ checkCode(); checkContent(); }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick);
  else tick();
  setInterval(tick, CHECK_MS);
  setInterval(applyContent, 15000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); } else { applyContent(); } });
})();

/* =====================================================================
   FACTURATION CLIENTS — ajouté le 31/07/2026
   Écran manuel : un client à la fois. Aucune automatisation, aucun cron.
   S'appuie sur guardApi() / guardEnsureAuth() / sheet() déjà présents.
   ===================================================================== */
(function(){
  var _bg=null;
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function eur(n){return (Number(n)||0).toFixed(0)+" €";}

  /* Ajoute le bouton d'accès sous la carte NexusGuard, sans la réécrire */
  var _orig=window.updateGuardCard;
  window.updateGuardCard=function(){
    if(typeof _orig==="function"){try{_orig.apply(this,arguments);}catch(e){}}
    var el=document.getElementById("guardCard");
    if(el&&!el.querySelector(".bill-open")){
      var d=document.createElement("div");
      d.style.cssText="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)";
      d.innerHTML='<button class="btn sm bill-open" onclick="billingOpen()">Facturation clients</button>';
      el.appendChild(d);
    }
  };
  try{window.updateGuardCard();}catch(e){}

  window.billingOpen=async function(){
    if(typeof guardEnsureAuth==="function"&&!(await guardEnsureAuth()))return;
    _bg=sheet('<div class="hd"><b>Facturation clients</b>'
      +'<button class="x" onclick="billingClose()">&times;</button></div>'
      +'<div id="billBody" class="muted" style="padding:6px 0">Chargement…</div>');
    billingList();
  };
  window.billingClose=function(){if(_bg){closeSheet(_bg);_bg=null;}};

  function body(){return document.getElementById("billBody");}

  window.billingList=async function(){
    var b=body(); if(!b)return;
    b.className=""; b.innerHTML='<div class="muted">Chargement…</div>';
    try{
      var d=await guardApi("list_clients",{});
      var cs=d.clients||[];
      if(!cs.length){
        b.innerHTML='<div class="muted" style="padding:10px 0">Aucun client actif.</div>'
          +'<button class="btn" onclick="billingForm()">Ajouter un client</button>';
        return;
      }
      var via=d.mail_via||"?";
      /* Le chemin n8n -> Resend fonctionne. Seule difference : n8n repond
         avant d'envoyer, donc la remise n'est pas confirmee en retour. */
      var alerte = via.indexOf("resend")<0
        ? '<div class="card" style="margin-bottom:10px">'
          +'<b>Envoi via n8n</b><div class="muted" style="font-size:12px">'
          +'Les mails partent bien, mais n8n ne confirme pas la remise. '
          +'Pour un retour d\'erreur precis (domaine, adresse rejetee), pose '
          +'RESEND_API_KEY dans Supabase. Facultatif.</div></div>'
        : '';
      b.innerHTML=alerte+'<div class="muted" style="margin-bottom:10px">Période '+esc(d.periode)+' · envoi par '+esc(via)+'</div>'
        +cs.map(function(c){
          var cy=c.cycle_courant;
          var etat = !cy ? '<span class="muted">demande non envoyée</span>'
            : cy.status==="paid" ? '<span style="color:#1d7a4c">payé</span>'
            : 'demande envoyée · échéance '+esc(cy.due_date);
          return '<div class="card" style="margin-bottom:10px">'
            +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
            +'<div><b>'+esc(c.nom)+'</b><div class="muted" style="font-size:12px">'+esc(c.email)+'</div>'
            +'<div class="muted" style="font-size:12px">'+eur(c.prix)+' / mois'
            +(c.site_name?' · '+esc(c.site_name):'')+'</div></div>'
            +'<div style="text-align:right;font-size:12px">'+etat+'</div></div>'
            +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
            +'<button class="btn sm" onclick="billingSend(\''+c.id+'\')">Envoyer la demande</button>'
            +'<button class="btn sm sec" onclick="billingForm(\''+c.id+'\')">Modifier</button>'
            +'<button class="btn sm sec" onclick="billingRemove(\''+c.id+'\')">Retirer</button>'
            +'</div></div>';
        }).join("")
        +'<button class="btn" style="width:100%;margin-top:4px" onclick="billingForm()">Ajouter un client</button>';
    }catch(e){
      if(e&&e.message!=="auth") b.innerHTML='<div class="muted">'+esc(e.message||e)+'</div>';
    }
  };

  window.billingSend=async function(id){
    if(!confirm("Envoyer la demande de règlement du mois à ce client ?\n\nLe mail part immédiatement. La date limite sera fixée à 7 jours."))return;
    try{
      var d=await guardApi("billing_request",{client_id:id});
      if(d.email_sent){
        toast((d.reutilise?"Demande renvoyée · échéance ":"Demande envoyée · échéance ")+d.deadline+" ("+(d.email_via||"")+")");
      } else {
        toast("Cycle enregistré — "+(d.email_error||"envoi non confirmé"));
      }
      billingList();
    }catch(e){ if(e&&e.message!=="auth") toast(e.message||"Échec de l'envoi."); }
  };

  window.billingRemove=async function(id){
    if(!confirm("Retirer ce client de la facturation ?\n\nIl ne sera plus listé, mais tout son historique de facturation est conservé."))return;
    try{ await guardApi("deactivate_client",{client_id:id}); toast("Client retiré."); billingList(); }
    catch(e){ if(e&&e.message!=="auth") toast(e.message||"Échec."); }
  };

  window.billingForm=async function(id){
    var c={id:"",nom:"",email:"",telephone:"",prix:""};
    if(id){
      try{
        var d=await guardApi("list_clients",{});
        var f=(d.clients||[]).find(function(x){return x.id===id;});
        if(f)c={id:f.id,nom:f.nom||"",email:f.email||"",telephone:f.telephone||"",prix:f.prix||""};
      }catch(e){ if(e&&e.message==="auth")return; }
    }
    var b=body(); if(!b)return;
    b.innerHTML='<div style="display:grid;gap:10px">'
      +'<label class="muted" style="font-size:12px">Nom<input id="bfNom" value="'+esc(c.nom)+'" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label>'
      +'<label class="muted" style="font-size:12px">E-mail<input id="bfMail" type="email" value="'+esc(c.email)+'" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label>'
      +'<label class="muted" style="font-size:12px">Téléphone (facultatif)<input id="bfTel" value="'+esc(c.telephone)+'" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label>'
      +'<label class="muted" style="font-size:12px">Tarif mensuel en euros<input id="bfPrix" type="number" min="1" step="1" value="'+esc(c.prix)+'" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px"></label>'
      +'<div style="display:flex;gap:8px;margin-top:4px">'
      +'<button class="btn" onclick="billingSave(\''+(c.id||"")+'\')">Enregistrer</button>'
      +'<button class="btn sec" onclick="billingList()">Annuler</button>'
      +'</div></div>';
  };

  window.billingSave=async function(id){
    var p={
      nom:(document.getElementById("bfNom")||{}).value||"",
      email:(document.getElementById("bfMail")||{}).value||"",
      telephone:(document.getElementById("bfTel")||{}).value||"",
      prix:(document.getElementById("bfPrix")||{}).value||""
    };
    if(id)p.client_id=id;
    try{ await guardApi("save_client",p); toast(id?"Client mis à jour.":"Client ajouté."); billingList(); }
    catch(e){ if(e&&e.message!=="auth") toast(e.message||"Enregistrement impossible."); }
  };
})();
</script>
<!-- ===================================================================
     LBA+ — Carte argent du mois & statut compte/invité (pilotage)
     Serveur : edge function pilotage-plus. Préfixe LBAP_ / lbap*.
     =================================================================== -->
<style>
.lbap-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.lbap-badge.compte{background:#DCFCE7;color:#166534}
.lbap-badge.invite{background:rgba(255,255,255,.10);color:#9C9488}
.lbap-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.lbap-bar i{display:block;height:100%;background:#E11D2A;border-radius:99px}
.lbap-var.up{color:#4ADE80}.lbap-var.down{color:#FCA5A5}
.lbap-chk{width:18px;height:18px}

/* ===== multi-sites ===== */
.sitecard{margin-bottom:12px}
.sc-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sc-tete b{font-size:16px}
.sc-note{font-size:13px;opacity:.7;line-height:1.5}
.sc-chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sc-chiffres div{text-align:center}
.sc-chiffres span{display:block;font-size:17px;font-weight:700}
.sc-chiffres i{font-size:11px;opacity:.65;font-style:normal}
.sc-actions{display:flex;gap:8px}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid currentColor;opacity:.85}
.moreit.on{font-weight:700}
.modrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.08)}
.modrow i{display:block;font-size:12px;opacity:.65;font-style:normal;margin-top:3px}
.jlist{margin-top:10px}
.jrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(0,0,0,.06);font-size:13px}
.jrow i{opacity:.6;font-style:normal;white-space:nowrap}
</style>
<script>
var LBAP = { card:null, clients:null, filter:'all', sel:{} };

async function lbapApi(action, payload){
  if(!TOKEN) throw new Error("Session expirée. Reconnecte-toi.");
  var r = await fetch(_SUPA + "/functions/v1/pilotage-plus", {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:ANON, Authorization:"Bearer "+ANON },
    body: JSON.stringify(Object.assign({ token:TOKEN, action:action }, payload||{}))
  });
  var j = await r.json().catch(function(){return {};});
  if(!r.ok) throw new Error(j.error || ("Erreur "+r.status));
  return j;
}
function lbapDate(s){ if(!s) return "—"; try{ return new Date(s).toLocaleDateString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return "—"; } }
function lbapHm(s){ if(!s) return ""; try{ return new Date(s).toLocaleTimeString("fr-FR",{timeZone:"UTC",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

/* ---------------- Argent : onglet Mois ---------------- */
async function lbapMois(){
  ARG.sub = "mois";
  setView('<div class="card"><div class="muted">Chargement…</div></div>');
  try{ LBAP.card = await lbapApi("money_card"); }catch(e){ setView('<div class="card"><div class="err">'+esc(e.message)+'</div></div>'); return; }
  argRender();
}
function lbapMoisBody(){
  var d = LBAP.card || {};
  var v = "";
  if(d.variation_pct !== null && d.variation_pct !== undefined){
    var up = d.variation_pct >= 0;
    v = ' <span class="lbap-var '+(up?"up":"down")+'">'+(up?"+":"")+d.variation_pct+' %</span> vs '+esc(d.prev_label||"");
  }
  var goal = d.objectif_cents > 0
    ? '<div class="tag" style="margin-top:10px">Objectif : '+argEur(d.objectif_cents)+' · '+d.objectif_pct+' %<div class="lbap-bar"><i style="width:'+Math.min(100,d.objectif_pct)+'%"></i></div></div>'
    : '';
  var jour = (d.a_encaisser||[]).filter(function(r){ return r.due_cents>0; });
  var jourHtml = jour.length
    ? '<div class="card"><h3>À encaisser aujourd\'hui</h3>' + jour.map(function(r){
        return '<div class="kv"><span>'+lbapHm(r.start_at)+' · '+esc(r.client_name)+'</span>'
          + '<b>'+argEur(r.due_cents)+' <button class="btn sm" onclick="lbapCollect(\''+r.id+'\','+r.due_cents+',\''+esc(r.client_name).replace(/'/g,"&#39;")+'\')">Encaisser</button></b></div>';
      }).join("") + '</div>'
    : '';
  var sumup = d.sumup_pending > 0
    ? '<div class="card"><h3>SumUp</h3><div class="tag">'+d.sumup_pending+' paiement(s) sans RDV rattaché.</div>'
      + '<button class="btn sec" style="width:100%;margin-top:8px" onclick="vArgent(\'sumup\')">Ouvrir le rapprochement</button></div>'
    : '';
  return '<div class="card">'
    + '<div class="argbig"><span>Encaissé · '+esc(d.mois_label||"")+'</span><b>'+argEur(d.encaisse_mois_cents)+'</b></div>'
    + '<div class="tag">Total depuis le début : '+argEur(d.encaisse_total_cents)+v+'</div>'
    + goal
    + '<div class="argrow" style="margin-top:12px">'
    + '<div><span>Acomptes du mois</span><b>'+argEur(d.acomptes_mois_cents)+'</b></div>'
    + '<div><span>Reste à encaisser</span><b class="argred">'+argEur(d.reste_mois_cents)+'</b></div></div>'
    + '<div class="argrow" style="margin-top:8px">'
    + '<div><span>Manque à gagner</span><b class="argred">'+argEur(d.manque_mois_cents)+'</b></div>'
    + '<div><span>&nbsp;</span><b><button class="btn sm sec" onclick="lbapRecap()">Récap du mois</button></b></div></div>'
    + '<div class="tag" style="margin-top:10px">Acomptes rattachés à la date de paiement · reste et manque à gagner rattachés au mois du RDV.</div>'
    + '</div>' + jourHtml + sumup;
}

function lbapCollect(id, due, nom){
  openSheet2("Encaisser le solde",
    '<div class="tag" style="margin-bottom:10px">'+esc(nom)+' · reste '+argEur(due)+'</div>'
    + '<label class="lb">Montant encaissé (€)</label><input id="lbapAmt" type="number" step="0.01" min="0" value="'+(due/100).toFixed(2)+'">'
    + '<label class="lb">Moyen de paiement</label><select id="lbapMet"><option value="cash">Espèces</option><option value="card">Carte</option><option value="transfer">Virement</option></select>'
    + '<label class="lb" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="lbapRecu" class="lbap-chk" checked> Envoyer le reçu par e-mail</label>'
    + '<button class="btn" style="width:100%;margin-top:14px" onclick="lbapDoCollect(\''+id+'\')">Valider l\'encaissement</button>');
}
async function lbapDoCollect(id){
  var eu = parseFloat(($("lbapAmt").value||"").replace(",","."));
  if(!(eu>0)) return toast("Entre un montant supérieur à zéro.");
  try{
    var d = await lbapApi("collect", { booking_id:id, amount_cents:Math.round(eu*100), method:$("lbapMet").value, receipt:$("lbapRecu").checked });
    closeSheet2();
    toast("Encaissé." + (d.recu ? " Reçu envoyé." : (d.recu_erreur ? " Reçu non envoyé : "+d.recu_erreur : "")));
    lbapMois();
  }catch(e){ toast(e.message||String(e)); }
}

async function lbapRecap(){
  try{
    var d = await lbapApi("monthly_recap", { offset:0 });
    var K = function(t,v){ return '<div class="kv"><span>'+t+'</span><b>'+v+'</b></div>'; };
    var moyens = Object.keys(d.par_moyen||{}).map(function(k){ return K(MOYENS[k]||k, argEur(d.par_moyen[k])); }).join("") || '<div class="tag">Aucun encaissement.</div>';
    openSheet2("Récap · "+esc(d.mois),
      K("Encaissé", argEur(d.encaisse_cents)) + K("dont acomptes", argEur(d.acomptes_cents)) + K("dont soldes", argEur(d.soldes_cents))
      + K("Reste à encaisser", argEur(d.reste_cents)) + K("Manque à gagner", argEur(d.manque_cents))
      + '<h3 style="margin:14px 0 4px">Par moyen</h3>' + moyens
      + '<h3 style="margin:14px 0 4px">Activité</h3>'
      + K("Rendez-vous", d.rdv_total) + K("dont honorés", d.rdv_honores) + K("dont annulés / absentes", d.rdv_perdus)
      + K("Nouvelles clientes", d.nouvelles_clientes) + K("Comptes créés", d.comptes_crees)
      + '<button class="btn sec" style="width:100%;margin-top:14px" onclick="window.print()">Imprimer</button>');
  }catch(e){ toast(e.message||String(e)); }
}

/* ---------------- Clientes : statut & invitation ---------------- */
async function lbapClients(){
  try{ LBAP.clients = await lbapApi("clients_list"); LBAP.sel = {}; lbapRenderClients(); }
  catch(e){ if($("clist")) $("clist").innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
}
function lbapVisible(){
  var d = LBAP.clients; if(!d) return [];
  var q = (($("cq") && $("cq").value) || "").toLowerCase();
  return d.rows.filter(function(c){
    if(LBAP.filter==="compte" && !c.compte) return false;
    if(LBAP.filter==="invite" &&  c.compte) return false;
    if(!q) return true;
    return [c.full_name,c.phone,c.email].some(function(v){ return (v||"").toLowerCase().indexOf(q)>=0; });
  });
}
function lbapRenderClients(){
  var d = LBAP.clients; if(!d) return;
  var pills = [["all","Tous",d.total],["compte","Compte",d.nb_compte],["invite","Invité",d.nb_invite]].map(function(p){
    return '<button class="btn sm '+(LBAP.filter===p[0]?"":"sec")+'" onclick="lbapFilter(\''+p[0]+'\')">'+p[1]+' '+p[2]+'</button>';
  }).join(" ");
  var nbSel = Object.keys(LBAP.sel).filter(function(k){return LBAP.sel[k];}).length;
  var bar = nbSel
    ? '<button class="btn sm" onclick="lbapInviteSel()">Inviter '+nbSel+' cliente(s)</button> <button class="btn sm sec" onclick="lbapSelNone()">Décocher</button>'
    : (LBAP.filter==="invite" ? '<button class="btn sm sec" onclick="lbapSelAll()">Tout sélectionner (max 20)</button>' : '');
  var dbl = (d.doublons||[]).length
    ? '<div class="card"><h3>Doublons repérés</h3>' + d.doublons.map(function(g,i){
        var noms = g.ids.map(function(id){ var c=d.rows.find(function(x){return x.id===id;}); return c?esc(c.full_name)+(c.compte?" (compte)":" (invité)"):""; }).join(" · ");
        return '<div class="kv"><span>'+noms+' — '+esc(g.motif)+'</span><b><button class="btn sm sec" onclick="lbapMergeAsk('+i+')">Fusionner</button></b></div>';
      }).join("") + '</div>'
    : '';
  if($("cli_extra")) $("cli_extra").innerHTML =
      '<div class="card" style="padding:10px"><div style="display:flex;gap:6px;flex-wrap:wrap">'+pills+'</div>'
    + (bar ? '<div style="margin-top:8px">'+bar+'</div>' : '')
    + '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'
    + '<button class="btn sm sec" onclick="lbapExportVue()">⬇ Exporter la vue</button>'
    + '<button class="btn sm sec" onclick="lbapExportTout()">⬇ Exporter tout</button>'
    + '<button class="btn sm sec" onclick="lbapTpl()">✉ Modèle d\'invitation</button></div></div>' + dbl;

  var rows = lbapVisible();
  if(!$("clist")) return;
  $("clist").innerHTML = rows.length ? '<div class="list">' + rows.map(function(c){
    var quand = c.compte ? "Compte créé le "+lbapDate(c.account_created_at)
      : (c.first_booking_at ? "1re réservation le "+lbapDate(c.first_booking_at) : "Ajoutée le "+lbapDate(c.created_at));
    var chk = !c.compte ? '<input type="checkbox" class="lbap-chk" '+(LBAP.sel[c.id]?"checked":"")+' onclick="event.stopPropagation();lbapSel(\''+c.id+'\',this.checked)"> ' : '';
    return '<div class="it" onclick=\'cliSheet("'+c.id+'")\'>'
      + '<div style="min-width:0;display:flex;align-items:center;gap:8px">'+chk
      + '<div style="min-width:0"><div style="font-weight:700">'+esc(c.full_name||"Client")+'</div>'
      + '<div class="tag">'+quand+'</div>'
      + '<div style="margin-top:3px">'+(window.LBAS ? LBAS.dueTag(c.id, c.due_cents) : (c.due_cents>0?'solde '+argEur(c.due_cents):''))+'</div></div></div>'
      + '<div style="text-align:right;flex:0 0 auto"><span class="lbap-badge '+(c.compte?"compte":"invite")+'">'+(c.compte?"Compte":"Invité")+'</span>'
      + '<div class="tag" style="margin-top:4px">'+c.nb_rdv+' RDV · ⭑ '+c.loyalty_stamps+'</div></div></div>';
  }).join("") + '</div>' : '<div class="muted">Aucune cliente dans ce filtre.</div>';
}
function lbapFilter(f){ LBAP.filter=f; LBAP.sel={}; lbapRenderClients(); }
function lbapSel(id,on){ LBAP.sel[id]=on; lbapRenderClients(); }
function lbapSelNone(){ LBAP.sel={}; lbapRenderClients(); }
function lbapSelAll(){ LBAP.sel={}; lbapVisible().filter(function(c){return !c.compte && c.email;}).slice(0,20).forEach(function(c){ LBAP.sel[c.id]=true; }); lbapRenderClients(); }

async function lbapInviteSel(){
  var ids = Object.keys(LBAP.sel).filter(function(k){ return LBAP.sel[k]; });
  if(!ids.length) return toast("Sélectionne au moins une cliente.");
  if(ids.length>20) return toast("20 envois maximum par lot.");
  try{
    var d = await lbapApi("client_invite", { client_ids: ids });
    var msg = d.envoyes.length+" invitation(s) envoyée(s)";
    if(d.ignores.length) msg += " · "+d.ignores.length+" ignorée(s) ("+d.ignores[0].raison+")";
    toast(msg); LBAP.sel={}; lbapClients();
  }catch(e){ toast(e.message||String(e)); }
}
function lbapMergeAsk(i){
  var d = LBAP.clients, g = d.doublons[i]; if(!g) return;
  var fiches = g.ids.map(function(id){ return d.rows.find(function(x){return x.id===id;}); }).filter(Boolean);
  if(fiches.length<2) return;
  var avec = fiches.filter(function(f){ return f.compte; });
  if(avec.length>1) return toast("Ces deux fiches ont chacune un compte : à traiter à la main.");
  var keep = avec.length ? avec[0] : fiches.slice().sort(function(a,b){ return b.nb_rdv-a.nb_rdv; })[0];
  var drop = fiches.filter(function(f){ return f.id!==keep.id; })[0];
  openSheet2("Fusionner deux fiches",
    '<div class="tag" style="margin-bottom:10px">Action irréversible. Les RDV, codes promo et fidélité de la fiche supprimée passent sur la fiche gardée.</div>'
    + '<div class="kv"><span>Fiche gardée</span><b>'+esc(keep.full_name)+' ('+(keep.compte?"compte":"invité")+')</b></div>'
    + '<div class="kv"><span>Fiche supprimée</span><b>'+esc(drop.full_name)+' · '+drop.nb_rdv+' RDV</b></div>'
    + '<button class="btn" style="width:100%;margin-top:14px" onclick="lbapDoMerge(\''+keep.id+'\',\''+drop.id+'\')">Fusionner</button>');
}
async function lbapDoMerge(keep, drop){
  try{ var d = await lbapApi("clients_merge", { keep_id:keep, drop_id:drop }); closeSheet2();
    toast("Fusionné · "+d.rdv_transferes+" RDV transféré(s)."); lbapClients();
  }catch(e){ toast(e.message||String(e)); }
}
function lbapTpl(){
  var t = (LBAP.clients && LBAP.clients.tpl) || { subject:"", body:"" };
  openSheet2("Mail « Créer mon espace client »",
    '<div class="tag" style="margin-bottom:10px">{prenom} est remplacé par le prénom. Le bouton et le lien sont ajoutés automatiquement.</div>'
    + '<label class="lb">Objet</label><input id="lbapTs" value="'+esc(t.subject)+'">'
    + '<label class="lb">Message</label><textarea id="lbapTb" rows="8">'+esc(t.body)+'</textarea>'
    + '<button class="btn" style="width:100%;margin-top:14px" onclick="lbapSaveTpl()">Enregistrer</button>');
}
async function lbapSaveTpl(){
  try{ await lbapApi("save_invite_tpl", { subject:$("lbapTs").value, body:$("lbapTb").value }); closeSheet2(); toast("Modèle enregistré."); lbapClients(); }
  catch(e){ toast(e.message||String(e)); }
}
function lbapCsv(rows, nom){
  var head = ["Nom","Téléphone","E-mail","Statut","Compte créé le","1re réservation","Dernière venue","Nb RDV","Total dépensé (€)","Solde dû (€)"];
  var q = function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  var csv = head.map(q).join(";")+"\n"+rows.map(function(c){
    return [c.full_name,c.phone||"",c.email||"",c.compte?"Compte":"Invité",
      c.compte?lbapDate(c.account_created_at):"",lbapDate(c.first_booking_at),lbapDate(c.last_booking_at),
      c.nb_rdv,(c.spent_cents/100).toFixed(2).replace(".",","),(c.due_cents/100).toFixed(2).replace(".",",")].map(q).join(";");
  }).join("\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=nom; a.click(); URL.revokeObjectURL(a.href);
}
function lbapExportVue(){ if(LBAP.clients) lbapCsv(lbapVisible(),"clients-vue.csv"); }
function lbapExportTout(){ if(LBAP.clients) lbapCsv(LBAP.clients.rows,"clients-tout.csv"); }

/* Panneau simple, indépendant des feuilles existantes */
function openSheet2(titre, html){
  closeSheet2();
  var d = document.createElement("div");
  d.id = "lbapSheet";
  d.style.cssText = "position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center";
  d.innerHTML = '<div style="background:#16130F;color:#F6F1E8;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:18px">'
    + '<div class="between"><h3 style="margin:0">'+titre+'</h3><button class="btn sm sec" onclick="closeSheet2()">Fermer</button></div>'
    + '<div style="margin-top:12px">'+html+'</div></div>';
  d.addEventListener("click", function(e){ if(e.target===d) closeSheet2(); });
  document.body.appendChild(d);
}
function closeSheet2(){ var e=document.getElementById("lbapSheet"); if(e) e.remove(); }
</script>

</body>

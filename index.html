<style>
:root{--red:#D81E2C;--red2:#b3151f;--ink:#16130F;--cream:#F6F1E8;--card:#ffffff;--line:#ece4d6;--muted:#8a8276;--ok:#1d8a4e;--amber:#b9821a;--blue:#2563a8;--gray:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--cream);position:relative;padding-bottom:40px}
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}

.tabs{position:sticky;top:54px;z-index:15;display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:var(--cream);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
#view{padding:14px}
h2{font-size:18px;margin:2px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.cfgCard{border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:12px 14px;margin:10px 0}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1}

label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;width:100%;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.ok{background:#127a4b}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.btn.gho{background:transparent;color:var(--red);border:1px solid var(--red)}

.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}

.pill.amber{background:#fdf2dc;color:var(--amber)}
.pill.ok{background:#e2f4ea;color:var(--ok)}
.pill.blue{background:#e4eef8;color:var(--blue)}
.pill.red{background:#fde3e5;color:var(--red)}
.pill.gray{background:#eee;color:var(--gray)}
.tag{font-size:11px;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .x{background:#fff;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;font-size:18px;line-height:1}
.daysel{display:flex;gap:6px;flex-wrap:wrap}
.daysel .d{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;width:46px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.daysel .d.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.thumb{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumb img{width:100%;height:110px;object-fit:cover;display:block}
.thumb .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;width:30px;height:30px;font-size:16px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center}
.auth .logo{width:64px;height:64px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 14px}
.auth h1{font-size:20px;margin:0 0 4px}
.auth p{color:var(--muted);font-size:13px;margin:0 0 18px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.pininput{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700}
/* ===== Refonte « wallet » — rouge/noir Locks ===== */
#view{padding-bottom:104px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#16130F 0%,#2a1113 52%,#7a1620 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));border-radius:0 0 24px 24px}

.topbar .hi{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.6;line-height:1}

.hero{background:linear-gradient(140deg,#1b1712 0%,#3a141a 50%,#9a1a26 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 12px 26px -14px rgba(154,26,38,.55)}
.hero .lab{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.72;text-align:center}
.hero .amt{font-size:34px;font-weight:800;text-align:center;margin:5px 0 3px;letter-spacing:.4px}
.hero .sub{font-size:12.5px;text-align:center;opacity:.82;margin-bottom:15px}
.hero .hbtns{display:flex;gap:10px}
.hero .hbtns button{flex:1;background:#fff;color:#16130F;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:700}

.circles{display:flex;justify-content:space-between;gap:6px;margin-bottom:14px}

.circles .c .ico{width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.05)}
.circles .c .ico svg{width:22px;height:22px}
.circles .c .lbl{font-size:11.5px;font-weight:600;color:var(--ink)}

.circles .c:nth-child(3) .ico{color:#2563a8}

.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(540px,calc(100% - 24px));background:#16130F;border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:9px 8px;z-index:30;box-shadow:0 14px 32px -10px rgba(0,0,0,.5)}
.bnav button{background:transparent;border:0;color:rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:4px 4px;flex:1}
.bnav button svg{width:21px;height:21px}
.bnav button.on{color:#fff}
.bnav button.ctr{flex:0 0 auto;gap:0}
.bnav button.ctr .bi{width:56px;height:56px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;margin-top:-24px;border:4px solid var(--cream);box-shadow:0 8px 18px -4px rgba(216,30,44,.6)}
.bnav button.ctr .bi svg{width:25px;height:25px;color:#fff}

.morelist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moreit{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 12px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
@media(min-width:640px){

/* ===== Modale de déplacement de RDV ===== */
.rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.rs-f{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.rs-f label{font-size:12px;font-weight:600;opacity:.75}
.rs-f select,.rs-f input,.rs-f textarea{width:100%;padding:9px 10px;border:1px solid rgba(0,0,0,.18);border-radius:9px;font:inherit;background:#fff;color:#16130F}
.rs-lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.6;margin:14px 0 6px}
.rs-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rs-day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;padding:8px 6px;border:1px solid rgba(0,0,0,.18);border-radius:11px;background:#fff;cursor:pointer;font-size:11px;color:#16130F}
.rs-day b{font-size:17px}
.rs-day.on{background:#16130F;color:#fff;border-color:#16130F}
.rs-slots{display:flex;flex-wrap:wrap;gap:7px}
.rs-slot{padding:8px 13px;border:1px solid rgba(0,0,0,.18);border-radius:9px;background:#fff;cursor:pointer;font-size:14px;color:#16130F}
.rs-slot.on{background:#D81E2C;color:#fff;border-color:#D81E2C}
.rs-money{font-size:13px;margin:6px 0 0}
.rs-warn{color:#B4820A;font-size:13px}
.rs-err{color:#D81E2C;font-size:13px;margin:8px 0 0}
.rs-hist{margin:14px 0 0;font-size:12.5px}
.rs-hrow{padding:4px 0;border-top:1px solid rgba(0,0,0,.08)}
.rs-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ===== Chantier Argent ===== */
.argbig{display:flex;flex-direction:column;gap:2px;margin:4px 0 12px}
.argbig span{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.6}
.argbig b{font-size:34px;line-height:1.1;font-weight:800}
.argrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.argrow span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.6}
.argrow b{font-size:21px;font-weight:700}
.argred{color:var(--red)}

/* ===== Chantier Catalogue ===== */
.catsec{padding:0;overflow:hidden}
.cathead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:14px 16px;font:inherit;font-weight:700;font-size:15px;text-align:left;cursor:pointer;color:inherit}
.catchev{opacity:.5;font-size:13px}
.catbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.pcard{border:1px solid rgba(0,0,0,.10);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.015)}
.pctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcname{font-weight:700;font-size:15px;min-width:0}
.pcprice{font-weight:800;font-size:18px;white-space:nowrap}
.pcdep{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(0,0,0,.08);font-size:13px}
.pcdep span{opacity:.6}
.pcact{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
.catmove{display:flex;gap:4px}
.diagpill{margin-left:auto;border:0;cursor:pointer;padding:6px 12px;border-radius:99px;font-weight:700;font-size:.72rem}
.diagpill.on{background:#0F8A4A;color:#fff}
.diagpill.off{background:#E9E2D4;color:#7A7266}

/* ===== Chantier Agenda ===== */
.agdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px;font-size:11px;opacity:.55;text-align:center}
.aggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

/* ===== Chantier Leads ===== */
.ld-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.ld-st{background:rgba(0,0,0,.04);border-radius:12px;padding:9px 6px;text-align:center}

.ld-lab{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin:10px 0 4px}
.ld-lab+input,.ld-lab+textarea{width:100%}
.ld-btn{border:1px solid rgba(0,0,0,.16);background:#fff;color:#16130F;border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;font-size:.78rem;cursor:pointer}
.ld-btn.dark{background:#16130F;color:#F6F1E8;border-color:#16130F}
.ld-btn.red{background:#E11D2A;color:#fff;border-color:#E11D2A}
.ld-list{border-top:1px solid rgba(0,0,0,.08)}
.ld-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.ld-left{min-width:0}
.ld-mail{font-weight:600;font-size:.88rem;word-break:break-all}
.ld-meta{font-size:.7rem;opacity:.6;margin-top:2px}
.ld-right{text-align:right;flex:0 0 auto}
.ld-sel{font-size:.72rem;padding:5px 7px;border-radius:8px;border:1px solid rgba(0,0,0,.16);background:#fff;color:#16130F;margin-top:4px}
.ld-pill{display:inline-block;font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:99px;margin-left:4px}
.ld-pill.cli{background:#E4F3E9;color:#0F8A4A}
.ld-pill.off{background:#EFEAE0;color:#7A7266}
.ld-acts{display:flex;gap:5px;justify-content:flex-end;margin-top:5px}
.ld-mini{border:0;background:none;font:inherit;font-size:.7rem;font-weight:700;cursor:pointer;color:#16130F;opacity:.65;padding:2px 4px}
.ld-mini.danger{color:#E11D2A;opacity:.85}
.ld-mut{font-size:.72rem;opacity:.5}
.ld-note{font-size:.72rem;opacity:.6;margin-top:10px;line-height:1.5}
.ld-warn{background:#FCEFB4;border:1px solid #EBD68A;border-radius:11px;padding:11px 13px;font-size:.8rem;color:#6b5410;line-height:1.55;margin-top:11px}
.ld-err{color:#E11D2A;font-size:.85rem}
.ld-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* bouton Leads dans le hero */
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.leadbtn{position:relative;background:rgba(246,241,232,.10);border:1px solid rgba(246,241,232,.22);border-radius:16px;padding:10px 14px 9px;text-align:center;color:inherit;cursor:pointer;min-width:92px;font:inherit}
.leadbtn .n{font-family:'Archivo';font-weight:900;font-size:1.55rem;line-height:1}
.leadbtn .l{font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;opacity:.6;font-weight:700;margin-top:2px}
.leadbtn .bdg{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;line-height:21px;padding:0 6px;border-radius:99px;background:#E11D2A;color:#fff;font-weight:800;font-size:.72rem;border:2px solid #1b1712}

/* =====================================================================

  #view .list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
  #view .list .card{margin-bottom:0}
  .card{transition:transform .16s,box-shadow .16s}

  .tabs{padding-left:0;padding-right:0}
}

    <div class="err" id="err">${msg?esc(msg):""}</div>

    const v=pin.value.trim();
    if(!/^\d{4,8}$/.test(v)){$("err").textContent="Code à 4 à 8 chiffres.";return}
    if(setup){const v2=$("pin2").value.trim();if(v!==v2){$("err").textContent="Les deux codes ne correspondent pas.";return}}

      const j=await api(setup?"set_pin":"login",{pin:v});
      if(j.token){

           cote : rien n'est partage entre les projets. Un site qui refuse
           n'empeche pas d'entrer ici, il apparaitra simplement comme
           indisponible dans la liste. */
        await ouvrirSitesDistants(v);

function go(k){
  TAB=k;
  /* Ferme le panneau ouvert SANS history.back() : le back() etant asynchrone,
     son popstate arrivait APRES le rendu et reaffichait l'onglet precedent. */
  const hadSheet=document.querySelectorAll(".sheet-bg").length>0;
  if(hadSheet) document.querySelectorAll(".sheet-bg").forEach(x=>x.remove());
  const main=["rdv","agenda","argent","clients"];
  document.querySelectorAll(".bnav button").forEach(b=>{const dk=b.dataset.k;b.classList.toggle("on",dk===k||(dk==="plus"&&!main.includes(k)))});
  const map={dash:vDash,argent:vArgent,agenda:vAgenda,leads:vLeads,rdv:vRdv,clients:vClients,presta:vPresta,dispo:vDispo,ferm:vFerm,promo:vPromo,fid:vFid,banner:vBanner,gal:vGal,contenu:vContenu,apparence:vApparence,diagq:vDiagQ,diagclients:vDiagClients,pay:vPay,accueilsites:vSites,journal:vJournal};
  if(k==="sites"){ feuilleSites(); return; }
  (map[k]||vDash)();
  window.scrollTo(0,0);
  const st=history.state;
  if(!st) history.replaceState({tab:k},'',location.href);
  else if(st.sheet) history.replaceState({tab:k},'',location.href);
  else if(st.tab!==k) history.pushState({tab:k},'',location.href);
}
window.addEventListener('popstate',function(e){
  const st=e.state;
  if(!st){ history.replaceState({tab:TAB},'',location.href); return; }
  if(!st.sheet) document.querySelectorAll('.sheet-bg').forEach(x=>x.remove());
  if(st&&st.tab){
    TAB=st.tab;
    const main=["rdv","agenda","argent","clients"];
    document.querySelectorAll(".bnav button").forEach(b=>{const dk=b.dataset.k;b.classList.toggle("on",dk===st.tab||(dk==="plus"&&!main.includes(st.tab)))});
    const map={dash:vDash,argent:vArgent,agenda:vAgenda,leads:vLeads,rdv:vRdv,clients:vClients,presta:vPresta,dispo:vDispo,ferm:vFerm,promo:vPromo,fid:vFid,banner:vBanner,gal:vGal,contenu:vContenu,apparence:vApparence,diagq:vDiagQ,diagclients:vDiagClients,pay:vPay,accueilsites:vSites,journal:vJournal};
    (map[st.tab]||vDash)();
    window.scrollTo(0,0);
  }
});

/* ============== SHEETS ============== */
function sheetRaw(el){const bg=el&&el.closest?el.closest(".sheet-bg"):null;(bg||document.querySelector(".sheet-bg"))?.remove()}
function sheet(html){
  let bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg)closeSheet(bg)});
  document.body.appendChild(bg);
  /* Le bouton Retour ferme le panneau au lieu de quitter le site. */
  if(!history.state||!history.state.sheet)
    history.pushState({tab:(history.state&&history.state.tab)||TAB,sheet:true},'',location.href);
  return bg;
}
function closeSheet(el){
  if(history.state&&history.state.sheet){ history.back(); return; }
  sheetRaw(el);
}

/* ============== SITES PILOTÉS ==============
   Liste volontairement écrite ici : ajouter un client se fait en trois
   lignes, sans migration ni écran d'administration. Quand il y en aura
   cinq ou plus, elle passera en base.

   Chaque site expose une fonction Edge qui accepte le MÊME code PIN,
   vérifié séparément par chaque projet. Aucune clé n'est partagée, et
   rien de secret ne figure dans ce fichier. */
const SITES = [
  { slug:"lba", nom:"Locks by Afro", initiales:"LA",
    natif:true },                       // ce pilotage, tel qu'il existe
  { slug:"mh",  nom:"Magic Hair", initiales:"MH",
    fn:"https://mrubsuooqcgwubxgqcqi.supabase.co/functions/v1/pilotage",
    admin:"https://magichairs.fr/admin.html" },
];

let SITE = localStorage.getItem("nx_site") || "lba";
const siteCourant = () => SITES.find(s => s.slug === SITE) || SITES[0];

/* Jetons distants, un par site. Obtenus avec le même PIN, jamais stockés
   en clair : seul le jeton signé est conservé, et il expire en 24 h. */
const JETONS = JSON.parse(localStorage.getItem("nx_jetons") || "{}");
const garderJetons = () => localStorage.setItem("nx_jetons", JSON.stringify(JETONS));

async function apiSite(site, action, extra = {}) {
  if (!site.fn) throw new Error("Ce site n'a pas de fonction de pilotage.");
  const r = await fetch(site.fn, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, token: JETONS[site.slug], ...extra }),
  });
  const d = await r.json().catch(() => ({}));
  if (d && d.reauth) { delete JETONS[site.slug]; garderJetons(); }
  return d;
}

/* Au déverrouillage, le même PIN ouvre chaque site distant. Un site qui
   refuse n'empêche pas les autres : on note l'échec et on continue. */
async function ouvrirSitesDistants(pin) {
  for (const s of SITES.filter(x => x.fn)) {
    try {
      const etat = await fetch(s.fn, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "etat" }),
      }).then(r => r.json());

      const d = await fetch(s.fn, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: etat.configure ? "login" : "setup", pin }),
      }).then(r => r.json());

      if (d.ok && d.token) { JETONS[s.slug] = d.token; }
      else console.warn("site refuse", s.slug, d.motif);
    } catch (e) { console.warn("site injoignable", s.slug, e); }
  }
  garderJetons();
}

function feuilleSites() {
  sheet(`<div class="hd"><h3>Changer de site</h3>
    <button class="x" onclick="closeSheet(this)">×</button></div>
    <div class="morelist">${SITES.map(s => `
      <button class="moreit${s.slug === SITE ? " on" : ""}"
        onclick="choisirSite('${s.slug}')">
        ${s.nom}${s.slug === SITE ? " ·  actuel" : ""}
        ${!s.natif && !JETONS[s.slug] ? "  —  code refusé" : ""}
      </button>`).join("")}</div>`);
}

async function choisirSite(slug) {
  const s = SITES.find(x => x.slug === slug);
  if (!s) return;
  document.querySelectorAll(".sheet-bg").forEach(x => x.remove());

  if (s.natif) {
    SITE = slug; localStorage.setItem("nx_site", slug);
    renderShell(); go("dash"); return;
  }

  if (!JETONS[slug]) { toast("Ce site a refusé le code. Reconnecte-toi."); return; }

  // Décision de cadrage : la bascule est une navigation, pas une fusion
  // d'écrans. On arrive directement dans l'admin du client, connecté.
  toast("Ouverture de " + s.nom + "…");
  const d = await apiSite(s, "sso");
  if (d.ok && d.lien) { location.href = d.lien; return; }
  toast(d.motif || "Impossible d'ouvrir ce site");
}

async function feuilleModules(slug) {
  const s = SITES.find(x => x.slug === slug);
  if (!s || !JETONS[slug]) { toast("Site indisponible"); return; }

  const d = await apiSite(s, "modules");
  if (!d.ok) { toast(d.motif || "Lecture impossible"); return; }

  sheet(`<div class="hd"><h3>Modules — ${esc(s.nom)}</h3>
    <button class="x" onclick="closeSheet(this)">×</button></div>
    <div class="morelist">${(d.modules || []).map(m => `
      <div class="modrow">
        <div><b>${esc(m.label)}</b>
          <i>${esc(m.description || "")}</i></div>
        <button class="btn sm ${m.active ? "" : "ghost"}"
          onclick="basculerModule('${slug}','${esc(m.slug)}',${!m.active})">
          ${m.active ? "Ouvert" : "Fermé"}
        </button>
      </div>`).join("")}</div>
    <div class="sc-note" style="padding:0 14px 14px">
      Un module fermé apparaît grisé, marqué SOON, et n'est pas cliquable
      dans l'administration du client.</div>`);
}

async function basculerModule(slug, module, actif) {
  const s = SITES.find(x => x.slug === slug);
  const d = await apiSite(s, "module_set", { slug: module, actif });
  if (!d.ok) { toast(d.motif || "Échec"); return; }
  toast(actif ? "Module ouvert" : "Module fermé");
  document.querySelectorAll(".sheet-bg").forEach(x => x.remove());
  feuilleModules(slug);
}

function simFactorRows(){
  return Object.entries(SIMWORK.doublage.factors).sort((a,b)=>(+a[0])-(+b[0])).map(([k,v])=>`

      </div>
    </div>`).join('');
}
function simRenderFactors(){ const el=$("simFactorsList"); if(el) el.innerHTML=simFactorRows(); }
function simFactorSet(k,v){ SIMWORK.doublage.factors[k]=parseFloat(v)||0; }
function simFactorRename(oldK,newK){
  newK=(newK||"").trim().replace(/[^0-9]/g,""); if(!newK){ toast("Le facteur doit être un nombre (ex. 5)."); simRenderFactors(); return; }
  if(newK===oldK) return;
  const v=SIMWORK.doublage.factors[oldK]; delete SIMWORK.doublage.factors[oldK];
  SIMWORK.doublage.factors[newK]=v; simRenderFactors();
}
function simFactorDel(k){
  if(Object.keys(SIMWORK.doublage.factors).length<=1){ toast("Garde au moins un facteur."); return; }
  delete SIMWORK.doublage.factors[k]; simRenderFactors();
}
function simFactorAdd(){
  let n=2; while(SIMWORK.doublage.factors[String(n)]!=null) n++;
  SIMWORK.doublage.factors[String(n)]=1; simRenderFactors();
}

    </div>`).join('');
}

function simTierDel(i){

function tcFromForm(){

    first_step:{ kind:kFs, value: kFs==="eur"?Math.round((parseFloat($("t_fsv").value)||0)*100):(parseFloat($("t_fsv").value)||0) },
    step:{ kind:kS, value: kS==="eur"?Math.round((parseFloat($("t_sv").value)||0)*100):(parseFloat($("t_sv").value)||0) },

function tierPreview(){
  const box=$("tierTable"); if(!box) return;

  for(let i=0;i<n;i++){

async function prestaImgUpload(){

async function prestaSave(id){
  const t=$("p_dtype").value;
  let dval=null;
  if(t!=="none"){const raw=parseFloat($("p_dval").value);if(!isNaN(raw))dval=t==="fixed"?Math.round(raw*100):Math.round(raw)}
  const days=[...document.querySelectorAll("#p_days .d.on")].map(d=>+d.dataset.d);
  const pmode=$("p_pmode").value;
  const service={
    name:$("p_name").value.trim()||"Prestation",
    category:$("p_cat").value.trim()||null,
    category_id:$("p_cat_id").value||null,
    description:$("p_desc").value.trim()||null,
    pricing_mode:pmode,
    price_cents: pmode==="fixed" ? Math.round((parseFloat($("p_price").value)||0)*100) : 0,
    unit_price_cents: pmode==="unit" ? Math.round((parseFloat($("p_unit").value)||0)*100) : null,
    tier_config: pmode==="tier" ? tcFromForm() : null,
    regrowth_enabled: $("p_regrow").checked,
    regrowth_config: ($("p_regrow").checked && window.LBAR) ? LBAR.value() : null,
    show_from_price: $("p_from").checked,
    sim_formula: $("p_simf") ? ($("p_simf").value||null) : null,
    length_price_enabled: $("p_lenon") ? $("p_lenon").checked : false,
    length_price_cents_per_cm: Math.round((parseFloat($("p_lenrate")?.value)||0)*100),
    duration_min:parseInt($("p_dur").value,10)||60,
    buffer_min: $("p_buf").value==="" ? null : Math.max(0, parseInt($("p_buf").value,10)||0),
    duree_txt:$("p_durtxt").value.trim()||null,
    deposit_type:t,
    deposit_value:dval,
    sort_order:parseInt($("p_sort").value,10)||0,
    active:$("p_active").value==="1",
    image_url:$("p_img").value.trim()||null,
    allowed_weekdays:days.length?days:null
  };
  if(id)service.id=id;
  try{
    const r=await api("service_save",{service});
    const savedId=id||r.id;
    let ids=diagIds(); const want=$("p_diag").checked; const has=ids.includes(savedId);
    if(want&&!has){ ids.push(savedId); await api("settings_save",{patch:{diag_required_ids:JSON.stringify(ids)}}); DATA.settings.diag_required_ids=JSON.stringify(ids); }
    else if(!want&&has){ ids=ids.filter(x=>x!==savedId); await api("settings_save",{patch:{diag_required_ids:JSON.stringify(ids)}}); DATA.settings.diag_required_ids=JSON.stringify(ids); }
    toast("Prestation enregistrée.");document.querySelector(".sheet-bg")?.remove();DATA=await api("bootstrap");go("presta")
  }
  catch(e){if(e.message!=="auth")toast(e.message)}
}
function diagIds(){ try{ return JSON.parse((DATA.settings||{}).diag_required_ids||"[]"); }catch(e){ return []; } }
async function toggleDiag(id){

function galCard(x){
  return `<div class="thumb"><img src="${esc(x.image_url)}" alt=""><button class="del" onclick="galDel('${x.id}')">×</button></div>`;
}
async function galUpload(){
  const files=Array.from($("g_file").files||[]);
  if(!files.length){toast("Choisis au moins une image.");return}
  const btn=$("g_btn");btn.disabled=true;
  const cap=$("g_cap").value.trim()||null;
  let ok=0;
  for(let i=0;i<files.length;i++){
    btn.innerHTML=files.length>1?`<span class="spin"></span> ${i+1}/${files.length}`:'<span class="spin"></span>';
    try{
      const f=files[i];
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      await api("gallery_upload",{b64,content_type:f.type||"image/jpeg",caption:cap});
      ok++;
    }catch(e){if(e.message==="auth")return; toast("Erreur sur "+(files[i].name||"une photo")+" : "+e.message)}
  }
  const j=await api("gallery");DATA.gallery=j.gallery||[];go("gal");
  toast(ok===files.length?(ok>1?ok+" photos ajoutées.":"Photo ajoutée."):`${ok}/${files.length} photos ajoutées.`);
}
async function galAddLink(){
  const url=$("g_url").value.trim();
  if(!url){toast("Colle un lien d'image.");return}
  const btn=$("g_urlbtn");btn.disabled=true;const t0=btn.textContent;btn.innerHTML='<span class="spin"></span>';
  try{
    await api("gallery_add",{image_url:url,caption:$("g_cap").value.trim()||null});
    const j=await api("gallery");DATA.gallery=j.gallery||[];go("gal");toast("Lien ajouté.");
  }catch(e){if(e.message!=="auth")toast(e.message);btn.disabled=false;btn.textContent=t0}
}
async function galDel(id){
  if(!confirm("Supprimer cette photo ?"))return;
  try{await api("gallery_del",{id});DATA.gallery=(DATA.gallery||[]).filter(x=>x.id!==id);go("gal");toast("Photo supprimée.")}
  catch(e){if(e.message!=="auth")toast(e.message)}
}

}

function nrSimUI(){
  const box=$("nrSim"); if(!box) return;

  if(!svc){ box.innerHTML=""; NR.sim=null; return; }

  NR.sim=NR.sim||{cm:15,factor:Object.keys(sim.doublage.factors)[0],rallonge:0,dia:sim.grosseur_mm.Fines,long:Object.keys(sim.coef_longueur)[0]};
  const diaChips=Object.entries(sim.grosseur_mm).map(([k,mm])=>`<button type="button" class="btn sm ${(+mm===+NR.sim.dia)?"":"sec"}" onclick="nrSimSet('dia',${mm})">${esc(k)} ${mm}mm</button>`).join(" ");

    h+=`<label>Longueur à doubler (cm)</label><input type="number" min="1" value="${NR.sim.cm}" oninput="nrSimSet('cm',this.value)">
    <label style="margin-top:8px">Doubler de</label><div style="display:flex;gap:6px;flex-wrap:wrap">${factorBtns}</div>

    <label style="margin-top:8px">Grosseur</label><div style="display:flex;gap:6px;flex-wrap:wrap">${diaChips}</div>`;
  } else if(svc.sim_formula==="reprise"){
    h+=`<label>Grosseur</label><div style="display:flex;gap:6px;flex-wrap:wrap">${diaChips}</div>
    <label style="margin-top:8px">Longueur (zone)</label><div style="display:flex;gap:6px;flex-wrap:wrap">${Object.keys(sim.coef_longueur).map(k=>`<button type="button" class="btn sm ${k===NR.sim.long?"":"sec"}" onclick="nrSimSet('long','${esc(k)}')">${esc(k)}</button>`).join(" ")}</div>`;
  }
  h+="</div>";
  box.innerHTML=h;
}
function nrSimSet(key,v){ NR.sim=NR.sim||{}; NR.sim[key]=v; nrSimUI(); nrCalc(); }
function nrLocks(v){ NR.nbLocks=parseInt(v,10)||1; const lv=$("nrLockVal"); if(lv) lv.textContent=NR.nbLocks; nrCalc(); }
function nrCalc(){
  if(!window.LBA) return;
  const cfg=LBA.cfgFrom(DATA.settings||{}); cfg.sim=LBA.simCfgFrom(DATA.sim_config||{});
  const level=$("nr_regrow").value||"ok";
  const lines=[]; let quota=false;
  NR.items.forEach(it=>{
    const p=svById(it.id); if(!p) return;
    const q=p.pricing_mode==="unit"?(parseInt(($("nrq_"+p.id)||{}).value,10)||1):null; it.qty=q;
    const simOpts=(LBA.needsSimFormula(p)&&NR.sim)?{cm:parseFloat(NR.sim.cm)||0,factor:NR.sim.factor,rallonge:parseFloat(NR.sim.rallonge)||0,dia:parseFloat(NR.sim.dia),long:NR.sim.long}:{};
    const r=LBA.itemPriceCents(p,Object.assign({nbLocks:NR.nbLocks,level,qty:q},simOpts),cfg);
    if(r===null){ quota=true; return; }
    lines.push({price:r.price,duration:p.duration_min||60,depositType:p.deposit_type,depositValue:p.deposit_value});
  });
  const c=$("nr_calc"); if(!c) return;
  if(quota){ c.textContent="⚠ Au-delà du barème : sur devis — saisis le total à la main."; return; }
  const t=LBA.cartTotals(lines,cfg);
  const mt=$("nr_total"), md=$("nr_dep");
  if(mt) mt.value=lines.length?(t.total/100).toFixed(2):"";
  if(md) md.value=lines.length?(t.deposit/100).toFixed(2):"";
  c.textContent=lines.length?(lines.length+" prestation(s) · "+(t.payeTout?"paiement intégral":("acompte "+t.depPct+"%"))+" · durée "+t.durationMin+" min. Total/Acompte modifiables ci-dessus."):"";
}
async function confirmRdvManual(btn){
  const prenom=$("nr_prenom").value.trim(),nom=$("nr_nom").value.trim(),email=$("nr_email").value.trim(),tel=$("nr_tel").value.trim();
  const date=$("nr_date").value,time=$("nr_time").value;
  const err=$("nr_err");
  const ko=m=>{ err.textContent=m; err.style.display="block"; };
  err.style.display="none";
  if(!nom) return ko("Nom requis.");
  if(!NR.items.length) return ko("Choisis au moins une prestation.");
  if(!date||!time) return ko("Choisis une date et une heure.");
  const paid=Math.round((parseFloat($("nr_paid").value)||0)*100);
  const payload={
    diagnostic:{prenom,nom,email,tel},
    items:NR.items.map(it=>({service_id:it.id,qty:it.qty||undefined,nb_locks:NR.nbLocks,regrowth_level:$("nr_regrow").value||"ok",
      sim_cm:(NR.sim&&NR.sim.cm)||undefined, sim_factor:(NR.sim&&NR.sim.factor)||undefined, sim_rallonge:(NR.sim&&NR.sim.rallonge)||undefined,
      sim_dia:(NR.sim&&NR.sim.dia)||undefined, sim_long:(NR.sim&&NR.sim.long)||undefined})),
    start_at:`${date}T${time}:00`, service_id:NR.items[0].id,
    manual:{ amount_cents:paid, method:$("nr_method").value||"cash", reminder:!!$("nr_reminder").checked, by:"pilotage", auth_token:TOKEN }
  };
  const tot=parseFloat($("nr_total").value), dep=parseFloat($("nr_dep").value);
  if(!isNaN(tot)||!isNaN(dep)){
    payload.admin_override={};
    if(!isNaN(tot)) payload.admin_override.total_cents=Math.round(tot*100);
    if(!isNaN(dep)) payload.admin_override.deposit_cents=Math.round(dep*100);
  }
  const t0=btn.textContent; btn.disabled=true; btn.textContent="Confirmation…";
  try{
    const res=await fetch(`${_SUPA}/functions/v1/create-sumup-checkout`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":`Bearer ${ANON}`},
      body:JSON.stringify(payload)
    });
    const out=await res.json();
    if(!res.ok){ btn.disabled=false; btn.textContent=t0; return ko(out.error||"Erreur."); }
    const due=typeof out.due_cents==="number"?out.due_cents:null;
    sheet(`<div class="hd"><h3>RDV confirmé</h3><button class="x" onclick="loadDash()">×</button></div>
      <div class="card"><p class="muted" style="margin:0">Confirmé sans lien de paiement.${paid>0?(" Encaissé : <b>"+euro(paid)+"</b>."):" Aucun encaissement enregistré."}${due!==null?(" Reste à régler : <b>"+euro(due)+"</b>."):""}</p>
      <p class="tag" style="margin-top:6px">${email?"E-mail de confirmation envoyé.":"Pas d'e-mail cliente : aucune confirmation envoyée."}</p></div>`);
  }catch(e){ btn.disabled=false; btn.textContent=t0; ko("Erreur réseau : "+(e.message||e)); }
}

function rsDone(m){ const o=document.querySelector('.sheet-bg'); if(o) o.remove(); toast(m); loadRdv(); }
async function rsCall(payload){
  if(!TOKEN){ throw new Error("Session expir\u00e9e. Reconnecte-toi."); }
  const r = await fetch(_SUPA+'/functions/v1/reschedule-booking',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},
    body:JSON.stringify(Object.assign({token:TOKEN},payload))});
  const out = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(out.error||('Erreur '+r.status));
  return out;
}

/* =====================================================================
   DÉPLACEMENT DE RENDEZ-VOUS  (edge function reschedule-booking)
   Met à jour Google Calendar, puis la base, puis notifie la cliente.
   Les créneaux proposés respectent exactement les règles du site :
   horaires d'ouverture, fermetures, blocages agenda et autres RDV.
   ===================================================================== */
var RS = { id: null, data: null, date: null, time: null, svc: null, dur: 60 };

function rsEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function rsEur(c) { return ((c || 0) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €'; }
/* Heure murale : les start_at sont stockés en UTC naïf, on lit donc les champs UTC. */
function rsWall(iso) {
  if (!iso) return { date: '', time: '' };
  var d = new Date(iso), p = function (n) { return String(n).padStart(2, '0'); };
  return {
    date: d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()),
    time: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes())
  };
}

async function openReschedule(id) {
  RS = { id: id, data: null, date: null, time: null, svc: null, dur: 60 };
  rsOpen('<h3>Modifier le rendez-vous</h3><p class="muted">Chargement des créneaux…</p>');
  try {
    var out = await rsCall({ action: 'options', booking_id: id });
    RS.data = out;
    RS.svc = out.booking.service_id;
    RS.dur = out.duration_min;
    var w = rsWall(out.booking.start_at);
    RS.date = w.date; RS.time = w.time;
    rsRender();
  } catch (e) {
    rsOpen('<h3>Modifier le rendez-vous</h3><p class="rs-err">' + rsEsc(e.message) + '</p>' + '<button type="button" class="btn sm sec" onclick="closeSheet(this)">Annuler</button>');
  }
}

async function rsReload() {
  var svc = document.getElementById('rs_svc').value;
  var dur = parseInt(document.getElementById('rs_dur').value, 10) || 60;
  var reason = document.getElementById('rs_reason') ? document.getElementById('rs_reason').value : '';
  var total = document.getElementById('rs_total') ? document.getElementById('rs_total').value : '';
  RS.svc = svc; RS.dur = dur; RS.time = null;
  try {
    var out = await rsCall({ action: 'options', booking_id: RS.id, service_id: svc, duration_min: dur });
    RS.data = out;
    rsRender(reason, total);
  } catch (e) { rsToast(e.message); }
}

function rsRender(keepReason, keepTotal) {
  var d = RS.data, b = d.booking;
  var cur = rsWall(b.start_at);
  var svcOpts = (d.services || []).map(function (s) {
    return '<option value="' + rsEsc(s.id) + '"' + (s.id === RS.svc ? ' selected' : '') + '>' + rsEsc(s.name) + '</option>';
  }).join('');

  var days = d.days || [];
  var dayChips = days.length ? days.map(function (x) {
    return '<button type="button" class="rs-day' + (x.date === RS.date ? ' on' : '') + '" onclick="rsPickDate(\'' + x.date + '\')">' +
      '<span>' + x.wd + '</span><b>' + x.dnum + '</b><span>' + x.month + '</span></button>';
  }).join('') : '<p class="muted">Aucun créneau libre sur les prochaines semaines.</p>';

  var day = days.filter(function (x) { return x.date === RS.date; })[0];
  var slotHtml = day
    ? day.slots.map(function (s) {
        return '<button type="button" class="rs-slot' + (s.t === RS.time ? ' on' : '') + '" onclick="rsPickTime(\'' + s.t + '\')">' + s.t + '</button>';
      }).join('')
    : '<p class="muted">Choisis d\'abord une date.</p>';

  var totalVal = keepTotal != null && keepTotal !== '' ? keepTotal : ((b.total_amount_cents || 0) / 100);
  var dep = b.deposit_amount_cents || 0;

  var histHtml = (d.history || []).length
    ? '<div class="rs-hist"><div class="rs-lab">Déplacements précédents</div>' + d.history.map(function (h) {
        var a = rsWall(h.old_start_at), n = rsWall(h.new_start_at);
        return '<div class="rs-hrow">' + a.date + ' ' + a.time + ' → <b>' + n.date + ' ' + n.time + '</b>' +
          (h.reason ? ' <span class="muted">· ' + rsEsc(h.reason) + '</span>' : '') +
          (h.email_sent ? '' : ' <span class="rs-warn">· cliente non notifiée</span>') + '</div>';
      }).join('') + '</div>'
    : '';

  var warn = b.linked_gcal ? '' : '<p class="rs-warn">Aucun événement Google n\'est encore lié à ce RDV : il sera créé au moment de la validation.</p>';

  rsOpen(
    '<h3>Modifier le rendez-vous</h3>' +
    '<p class="muted">Actuellement le ' + cur.date + ' à ' + cur.time + '</p>' + warn +
    '<div class="rs-grid">' +
      '<div class="rs-f"><label>Prestation</label><select id="rs_svc" onchange="rsReload()">' + svcOpts + '</select></div>' +
      '<div class="rs-f"><label>Durée (min)</label><input id="rs_dur" type="number" min="15" step="15" value="' + RS.dur + '" onchange="rsReload()"></div>' +
    '</div>' +
    '<div class="rs-lab">Nouvelle date</div><div class="rs-days">' + dayChips + '</div>' +
    '<div class="rs-lab">Créneau</div><div class="rs-slots" id="rs_slots">' + slotHtml + '</div>' +
    '<div class="rs-f"><label>Motif du déplacement (repris dans l\'e-mail à la cliente)</label>' +
      '<textarea id="rs_reason" rows="2" placeholder="Ex : imprévu au salon, je vous décale d\'une journée.">' + rsEsc(keepReason || '') + '</textarea></div>' +
    '<div class="rs-grid">' +
      '<div class="rs-f"><label>Nouveau total (€)</label><input id="rs_total" type="number" step="0.01" min="0" value="' + totalVal + '" oninput="rsMoney()"></div>' +
      '<div class="rs-f"><label>Acompte déjà réglé</label><input type="text" value="' + rsEur(dep) + '" disabled></div>' +
    '</div>' +
    '<p class="rs-money" id="rs_money"></p>' +
    histHtml +
    '<p class="rs-err" id="rs_err" style="display:none"></p>' +
    '<div class="rs-foot">' + '<button type="button" class="btn sm sec" onclick="closeSheet(this)">Annuler</button>' +
      '<button type="button" class="' + 'btn sm' + '" id="rs_go" onclick="rsSubmit(this)">Déplacer et prévenir la cliente</button>' +
    '</div>'
  );
  rsMoney();
}

function rsMoney() {
  var el = document.getElementById('rs_money'); if (!el) return;
  var b = RS.data.booking;
  var total = Math.round((parseFloat(document.getElementById('rs_total').value) || 0) * 100);
  var dep = b.deposit_amount_cents || 0;
  if (dep > total) {
    el.className = 'rs-money rs-warn';
    el.textContent = 'Trop-perçu de ' + rsEur(dep - total) + ' : à rembourser à la cliente sur place (SumUp ne rembourse pas automatiquement).';
  } else {
    el.className = 'rs-money muted';
    el.textContent = 'Reste à régler sur place : ' + rsEur(total - dep) + '.';
  }
}

function rsPickDate(d) { RS.date = d; RS.time = null; rsKeepRender(); }
function rsPickTime(t) { RS.time = t; rsKeepRender(); }
function rsKeepRender() {
  var r = document.getElementById('rs_reason'), t = document.getElementById('rs_total');
  rsRender(r ? r.value : '', t ? t.value : '');
}

async function rsSubmit(btn) {
  var err = document.getElementById('rs_err');
  var ko = function (m) { err.textContent = m; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Déplacer et prévenir la cliente'; };
  err.style.display = 'none';
  if (!RS.date || !RS.time) return ko('Choisis une date et un créneau.');
  btn.disabled = true; btn.textContent = 'Déplacement…';
  try {
    var out = await rsCall({
      action: 'apply', booking_id: RS.id,
      date: RS.date, time: RS.time,
      service_id: document.getElementById('rs_svc').value,
      duration_min: parseInt(document.getElementById('rs_dur').value, 10) || 60,
      reason: document.getElementById('rs_reason').value || '',
      total_cents: Math.round((parseFloat(document.getElementById('rs_total').value) || 0) * 100)
    });
    var msg = 'Rendez-vous déplacé au ' + RS.date + ' à ' + RS.time + '.';
    if (out.no_email) msg += ' Attention : aucune adresse e-mail en base, la cliente n\'a PAS été prévenue.';
    else if (!out.email_sent) msg += ' Attention : l\'e-mail n\'est pas parti (' + (out.mail_error || 'erreur inconnue') + ').';
    if (out.overpaid_cents > 0) msg += ' Trop-perçu de ' + rsEur(out.overpaid_cents) + ' à rembourser sur place.';
    if (out.warning) msg += ' ' + out.warning;
    rsDone(msg);
  } catch (e) { ko(e.message); }
}


/* =====================================================================
   CHANTIER ARGENT
   Tableau de bord (encaissé / reste / attendu), encaissement sur place,
   impayés avec relance, rapprochement des transactions SumUp.
   Serveur : edge functions pilotage-money et sumup-sync.
   ===================================================================== */
var ARG = { period: "month", data: null, unpaid: null, sumup: null, sub: "dash" };

async function moneyApi(action, payload) {
  if (!TOKEN) throw new Error("Session expirée. Reconnecte-toi.");
  const r = await fetch(_SUPA + "/functions/v1/pilotage-money", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
    body: JSON.stringify(Object.assign({ token: TOKEN, action: action }, payload || {})),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
  return j;
}
async function sumupApi(action, payload) {
  if (!TOKEN) throw new Error("Session expirée. Reconnecte-toi.");
  const r = await fetch(_SUPA + "/functions/v1/sumup-sync", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
    body: JSON.stringify(Object.assign({ token: TOKEN, action: action }, payload || {})),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
  return j;
}

var MOYENS = { cash: "Espèces", card: "Carte", transfer: "Virement", online: "En ligne" };
function argEur(c) { return ((c || 0) / 100).toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €"; }
/* Heure murale : start_at est stocké en UTC naïf, on lit donc les champs UTC. */
function argWhen(iso) {
  if (!iso) return "—";
  var d = new Date(iso), p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1) + " " + p(d.getUTCHours()) + "h" + p(d.getUTCMinutes());
}

/* ---------------- Vue principale ---------------- */
async function vArgent(sub) {
  ARG.sub = sub || ARG.sub || "dash";
  setView('<div class="card"><h3>Argent</h3><div class="tag">Chargement…</div></div>');
  try {
    if (ARG.sub === "dash") ARG.data = await moneyApi("dashboard", { period: ARG.period });
    if (ARG.sub === "unpaid") ARG.unpaid = await moneyApi("unpaid", {});
    if (ARG.sub === "sumup") ARG.sumup = await sumupApi("pending", {});
  } catch (e) {
    setView('<div class="card"><h3>Argent</h3><div class="tag" style="color:var(--red)">' + esc(e.message) + "</div></div>");
    return;
  }
  argRender();
}

function argRender() {
  var tabs = [["mois", "Le mois"], ["dash", "Tableau"], ["unpaid", "Impayés"], ["sumup", "SumUp"]]
    .map(function (t) {
      var fn = t[0] === "mois" ? "lbapMois()" : "vArgent('" + t[0] + "')";
      return '<button class="btn sm ' + (ARG.sub === t[0] ? "" : "sec") + '" onclick="' + fn + '">' + t[1] + "</button>";
    }).join(" ");
  var body = ARG.sub === "mois" ? lbapMoisBody() : ARG.sub === "dash" ? argDash() : ARG.sub === "unpaid" ? argUnpaid() : argSumup();
  setView('<div class="card"><div class="between"><h3>Argent</h3></div>'
    + '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">' + tabs + "</div></div>"
    + '<div id="lbasToday"></div>' + body);
  /* LBA SOLDE v2 : bloc « À encaisser aujourd'hui » regroupé par cliente */
  if (window.LBAS && LBAS.mountToday) LBAS.mountToday("lbasToday");
}

/* ---------------- Tableau de bord ---------------- */
function argDash() {
  var d = ARG.data || {};
  var periodes = [["day", "Jour"], ["week", "Semaine"], ["month", "Mois"], ["all", "Total"]]
    .map(function (p) {
      return '<button class="btn sm ' + (ARG.period === p[0] ? "" : "sec") + '" onclick="argPeriod(\'' + p[0] + "')\">" + p[1] + "</button>";
    }).join(" ");
  var moyens = Object.keys(d.par_moyen || {}).map(function (k) {
    return '<div class="kv"><span>' + (MOYENS[k] || k) + "</span><b>" + argEur(d.par_moyen[k]) + "</b></div>";
  }).join("") || '<div class="tag">Aucun encaissement sur la période.</div>';

  return '<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + periodes + "</div>"
    + '<div class="argbig"><span>Encaissé</span><b>' + argEur(d.encaisse_cents) + "</b></div>"
    + '<div class="argrow"><div><span>Reste à encaisser</span><b class="argred">' + argEur(d.reste_cents) + "</b></div>"
    + "<div><span>Total attendu</span><b>" + argEur(d.attendu_cents) + "</b></div></div>"
    + '<div class="tag" style="margin-top:10px">Les RDV annulés ou absents sont exclus du reste : l\'acompte est acquis au salon.</div>'
    + "</div>"
    + '<div class="card"><h3>Par moyen de paiement</h3>' + moyens + "</div>"
    + '<div class="card"><h3>Activité</h3>'
    + '<div class="kv"><span>RDV aujourd\'hui</span><b>' + (d.rdv_aujourdhui || 0) + "</b></div>"
    + '<div class="kv"><span>RDV à venir</span><b>' + (d.rdv_avenir || 0) + "</b></div></div>"
    + '<div class="card"><h3>Export comptable</h3>'
    + '<button class="btn sec" style="width:100%" onclick="argExport()">Télécharger le CSV de la période</button></div>';
}
function argPeriod(p) { ARG.period = p; vArgent("dash"); }

async function argExport() {
  try {
    var j = await moneyApi("payments", { period: ARG.period });
    var rows = j.rows || [];
    if (!rows.length) { toast("Aucun encaissement sur la période."); return; }
    var head = ["Date", "Cliente", "Prestation", "Montant", "Moyen", "Type", "Statut", "Saisi par", "Date RDV"];
    var lines = [head.join(";")].concat(rows.map(function (r) {
      return [csvCell(r.date), csvCell(r.cliente), csvCell(r.prestation),
        csvCell(((r.montant_cents || 0) / 100).toFixed(2).replace(".", ",")),
        csvCell(MOYENS[r.moyen] || r.moyen), csvCell(r.type), csvCell(r.statut),
        csvCell(r.saisi_par), csvCell(r.date_rdv || "")].join(";");
    }));
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "encaissements-" + ARG.period + ".csv";
    a.click();
    toast(rows.length + " ligne(s) exportée(s).");
  } catch (e) { toast(e.message); }
}

/* ---------------- Impayés ---------------- */
function argUnpaid() {
  var u = ARG.unpaid || {};
  var rows = u.rows || [];
  if (!rows.length) return '<div class="card"><div class="tag">Aucun solde en attente. Tout est encaissé.</div></div>';
  return '<div class="card"><div class="between"><h3>' + rows.length + " impayé(s)</h3>"
    + "<b>" + argEur(u.total_due_cents) + "</b></div></div>"
    + rows.map(function (r) {
      return '<div class="card"><div class="between"><div style="min-width:0">'
        + '<div style="font-weight:700">' + esc(r.client_name) + "</div>"
        + '<div class="tag">' + argWhen(r.start_at) + " · " + esc(r.service_name)
        + (r.manual_confirmed ? ' · <b style="color:#127a4b">confiance</b>' : "") + "</div></div>"
        + '<div style="text-align:right"><b class="argred">' + argEur(r.due_cents) + "</b>"
        + '<div class="tag">réglé ' + argEur(r.paid_cents) + " / " + argEur(r.total_cents) + "</div></div></div>"
        + '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'
        + '<button class="btn sm" onclick="encaisserSheet(\'' + r.id + "','" + r.due_cents + "')\">Encaisser</button>"
        + (window.LBAS ? '<button class="btn sm sec" onclick="LBAS.openBooking(\''+r.id+'\')">Lien SumUp</button>' : "")
        + (r.client_email
          ? '<button class="btn sm sec" onclick="argRemind(this,\'' + r.id + '\')">Relancer par mail</button>'
          : '<span class="tag" style="align-self:center">Pas d\'e-mail</span>')
        + "</div></div>";
    }).join("");
}

async function argRemind(btn, id) {
  btn.disabled = true; btn.textContent = "Envoi…";
  try {
    var j = await moneyApi("remind", { booking_id: id });
    toast("Relance envoyée à " + j.to + ".");
    btn.textContent = "Relancé";
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "Relancer par mail"; }
}

/* ---------------- Encaissement sur place ---------------- */
function encaisserSheet(bookingId, dueCents) {
  var due = parseInt(dueCents, 10) || 0;
  sheet('<div class="hd"><h3>Encaisser</h3><button class="x" onclick="closeSheet(this)">×</button></div>'
    + '<div class="card">'
    + '<div class="tag">Solde restant : ' + argEur(due) + "</div>"
    + '<label style="display:block;margin-top:10px;font-size:12px;font-weight:600">Montant encaissé (€)</label>'
    + '<input id="enc_amt" type="number" step="0.01" min="0" value="' + (due / 100) + '">'
    + '<label style="display:block;margin-top:10px;font-size:12px;font-weight:600">Moyen de paiement</label>'
    + '<select id="enc_meth"><option value="cash">Espèces</option><option value="card">Carte</option>'
    + '<option value="transfer">Virement</option></select>'
    + '<div class="tag" style="margin-top:8px">Un montant supérieur au solde est accepté et signalé.</div>'
    + '<div style="display:flex;gap:8px;margin-top:14px">'
    + '<button class="btn sec" onclick="closeSheet(this)">Annuler</button>'
    + '<button class="btn" onclick="encaisserGo(this,\'' + bookingId + '\')">Enregistrer</button>'
    + "</div></div>");
}
async function encaisserGo(btn, bookingId) {
  var amt = Math.round((parseFloat(document.getElementById("enc_amt").value) || 0) * 100);
  var meth = document.getElementById("enc_meth").value;
  if (amt <= 0) { toast("Montant invalide."); return; }
  btn.disabled = true; btn.textContent = "Enregistrement…";
  try {
    var j = await moneyApi("collect", { booking_id: bookingId, amount_cents: amt, method: meth });
    var bg = document.querySelector(".sheet-bg"); if (bg) bg.remove();
    toast("Encaissé. Reste " + argEur(j.due_cents) + (j.depasse ? " · montant supérieur au solde" : ""));
    vArgent(ARG.sub === "dash" ? "dash" : "unpaid");
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "Enregistrer"; }
}

/* ---------------- Rapprochement SumUp ---------------- */
function argSumup() {
  var s = ARG.sumup || {};
  var rows = s.rows || [];
  var head = '<div class="card"><div class="between"><h3>Transactions à rapprocher</h3>'
    + "<b>" + (s.en_attente || 0) + "</b></div>"
    + '<div class="tag">Encaissements SumUp non encore reliés à un rendez-vous.</div>'
    + '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'
    + '<button class="btn sm" onclick="argImport(this,60)">Importer 60 jours</button>'
    + '<button class="btn sm sec" onclick="argImport(this,400)">Importer 400 jours</button>'
    + "</div></div>";
  if (!rows.length) return head + '<div class="card"><div class="tag">Rien à rapprocher pour le moment.</div></div>';

  return head + rows.map(function (t) {
    var opts = (t.candidats || []).map(function (c) {
      return '<option value="' + c.booking_id + '"' + (c.booking_id === t.suggestion ? " selected" : "") + ">"
        + esc(c.client_name) + " · " + argWhen(c.start_at) + " · dû " + argEur(c.du_cents)
        + (c.exact ? " ✓" : "") + "</option>";
    }).join("");
    return '<div class="card"><div class="between"><div style="min-width:0">'
      + '<div style="font-weight:800;font-size:17px">' + argEur(t.amount_cents) + "</div>"
      + '<div class="tag">' + argWhen(t.occurred_wall) + " · " + esc(t.payment_type || "")
      + (t.card_type && t.card_type !== "UNKNOWN" ? " · " + esc(t.card_type) : "") + "</div></div>"
      + (t.suggestion ? '<span class="pill ok">Suggéré</span>' : '<span class="pill amber">À choisir</span>')
      + "</div>"
      + (opts
        ? '<select id="su_' + t.transaction_code + '" style="margin-top:10px">' + opts + "</select>"
        : '<div class="tag" style="margin-top:8px">Aucun rendez-vous compatible dans les 30 h.</div>')
      + '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'
      + (opts ? '<button class="btn sm" onclick="argLink(this,\'' + t.transaction_code + '\')">Rattacher</button>' : "")
      + '<button class="btn sm sec" onclick="argIgnore(this,\'' + t.transaction_code + '\')">Ignorer</button>'
      + "</div></div>";
  }).join("");
}

async function argImport(btn, days) {
  btn.disabled = true; var old = btn.textContent; btn.textContent = "Import…";
  try {
    var since = new Date(Date.now() - days * 864e5).toISOString();
    var j = await sumupApi("import", { since: since });
    toast(j.retenues + " transaction(s) traitée(s), " + j.doublons_ecartes + " doublon(s) écarté(s), " + j.en_attente + " à rapprocher.");
    vArgent("sumup");
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = old; }
}

/* =====================================================================
   CHANTIER CATALOGUE
   Cartes facon admin, repliees en accordeon par categorie, recherche,
   duplication et reordonnancement. Le formulaire d'edition existant
   (prestaEdit / prestaSave) n'est pas touche.
   ===================================================================== */
var CAT = { open: {}, q: "", reorder: false };

/* Champs acceptes par l'action serveur service_save. On construit les
   payloads a partir de cette liste pour ne jamais envoyer de champ calcule
   qui ferait echouer l'enregistrement. */
var PRESTA_FIELDS = ["name", "category", "category_id", "description", "pricing_mode",
  "price_cents", "unit_price_cents", "tier_config", "regrowth_enabled", "show_from_price",
  "sim_formula", "length_price_enabled", "length_price_cents_per_cm", "duration_min",
  "duree_txt", "deposit_type", "deposit_value", "sort_order", "active", "image_url",
  "allowed_weekdays", "regrowth_config", "buffer_min", "minutes_per_lock"];
function prestaPayload(s, patch) {
  var o = {};
  PRESTA_FIELDS.forEach(function (k) { if (s[k] !== undefined) o[k] = s[k]; });
  return Object.assign(o, patch || {});
}

function catList() {
  var sv = (DATA.services || []).slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
  var q = CAT.q.trim().toLowerCase();
  if (q) sv = sv.filter(function (s) { return String(s.name || "").toLowerCase().indexOf(q) >= 0; });
  var groups = {};
  sv.forEach(function (s) {
    var k = (s.category || "Sans catégorie").trim() || "Sans catégorie";
    (groups[k] = groups[k] || []).push(s);
  });
  return groups;
}

function prestaCard(s, idx, total, cat) {
  var diagOn = diagIds().indexOf(s.id) >= 0;
  var prix = s.show_from_price ? "dès " + euro(s.price_cents) : euro(s.price_cents);
  var sousTitre = [s.category, s.duree_txt || (s.duration_min + " min")].filter(Boolean).join(" · ");
  var fleches = CAT.reorder
    ? '<div class="catmove">'
      + '<button class="btn sm sec" ' + (idx === 0 ? "disabled" : "") + ' onclick="catMove(\'' + s.id + "',-1,'" + escAttr(cat) + '\')">↑</button>'
      + '<button class="btn sm sec" ' + (idx === total - 1 ? "disabled" : "") + ' onclick="catMove(\'' + s.id + "',1,'" + escAttr(cat) + '\')">↓</button>'
      + "</div>"
    : "";
  return '<div class="pcard">'
    + '<div class="pctop"><div class="pcname">' + esc(s.name)
    + (s.active === false ? ' <span class="pill gray">masquée</span>' : "") + "</div>"
    + '<div class="pcprice">' + prix + "</div></div>"
    + '<div class="tag">' + esc(sousTitre) + "</div>"
    + '<div class="pcdep"><span>Acompte</span><b>' + esc(depLabel(s)) + "</b></div>"
    + '<div class="pcact">'
    + '<button class="btn sm sec" onclick="prestaEdit(\'' + s.id + '\')">Modifier</button>'
    + '<button class="btn sm sec" onclick="prestaDuplicate(\'' + s.id + '\')">Dupliquer</button>'
    + fleches
    + '<button type="button" class="diagpill ' + (diagOn ? "on" : "off") + '" onclick="toggleDiag(\'' + s.id + '\')">'
    + (diagOn ? "Diag ON" : "Diag OFF") + "</button>"
    + "</div></div>";
}

function escAttr(v) { return String(v == null ? "" : v).replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function catAccordion() {
  var groups = catList();
  var keys = Object.keys(groups).sort();
  if (!keys.length) return '<div class="card"><div class="tag">Aucune prestation ne correspond.</div></div>';
  return keys.map(function (k) {
    var items = groups[k];
    var ouvert = !!CAT.open[k] || !!CAT.q.trim();
    return '<div class="card catsec">'
      + '<button class="cathead" onclick="catToggle(\'' + escAttr(k) + '\')">'
      + "<span>" + esc(k) + ' <span class="tag">(' + items.length + ")</span></span>"
      + '<span class="catchev">' + (ouvert ? "▾" : "▸") + "</span></button>"
      + (ouvert
        ? '<div class="catbody">' + items.map(function (s, i) { return prestaCard(s, i, items.length, k); }).join("") + "</div>"
        : "")
      + "</div>";
  }).join("");
}

function catToggle(k) { CAT.open[k] = !CAT.open[k]; vPresta(); }
function catSearch(v) { CAT.q = v; vPresta(); }
function catReorder() { CAT.reorder = !CAT.reorder; vPresta(); }

/* Reordonnancement : on echange les sort_order des deux voisins dans la
   meme categorie, puis on reenregistre les deux prestations completes.
   Envoyer un objet partiel risquerait d'ecraser les autres champs. */
async function catMove(id, dir, cat) {
  var groups = catList();
  var items = groups[cat] || [];
  var i = items.findIndex(function (s) { return s.id === id; });
  var j = i + dir;
  if (i < 0 || j < 0 || j >= items.length) return;
  var a = items[i], b = items[j];
  var sa = a.sort_order || 0, sb = b.sort_order || 0;
  if (sa === sb) { sa = i; sb = j; }  // ordres identiques : on les depart
  try {
    await api("service_save", { service: prestaPayload(a, { id: a.id, sort_order: sb }) });
    await api("service_save", { service: prestaPayload(b, { id: b.id, sort_order: sa }) });
    a.sort_order = sb; b.sort_order = sa;
    vPresta();
  } catch (e) { toast(e.message); }
}

async function prestaDuplicate(id) {
  var s = svById(id);
  if (!s) return;
  if (!confirm("Dupliquer « " + s.name + " » ? La copie sera créée masquée.")) return;
  try {
    var copie = prestaPayload(s, {
      name: s.name + " (copie)",
      active: false,                       // jamais publiee par accident
      sort_order: (s.sort_order || 0) + 1,
      image_url: s.image_url || null,
    });
    var r = await api("service_save", { service: copie });
    toast("Copie créée, masquée. Ouvre-la pour l'ajuster.");
    await loadDash();
    vPresta();
    if (r && r.id) prestaEdit(r.id);
  } catch (e) { toast(e.message); }
}

   CHANTIER AGENDA
   Calendrier du mois, RDV et creneaux libres au tap, blocage de creneau
   pousse dans Google Agenda, statut Absente avec acompte conserve.
   ===================================================================== */
var AG = { mois: null, jour: null, slots: null, svcId: null, bks: null };

async function agendaApi(action, payload) {
  if (!TOKEN) throw new Error("Session expirée. Reconnecte-toi.");
  var r = await fetch(_SUPA + "/functions/v1/pilotage-agenda", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
    body: JSON.stringify(Object.assign({ token: TOKEN, action: action }, payload || {})),
  });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
  return j;
}

var MOIS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function agYmd(d) { var p = function (n) { return String(n).padStart(2, "0"); }; return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()); }
/* Aujourd'hui en heure murale Martinique (les RDV sont stockés ainsi). */
function agToday() { return new Date(Date.now() - 4 * 3600e3); }

async function vAgenda() {
  if (AG.bks === null) {
    setView('<div class="card"><h3>Agenda</h3><div class="tag">Chargement…</div></div>');
    try { var jj = await api("bookings", { scope: "all" }); AG.bks = jj.bookings || []; }
    catch (e) { AG.bks = []; }
  }
  if (!AG.mois) { var n = agToday(); AG.mois = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 1)); }
  var m = AG.mois, an = m.getUTCFullYear(), mo = m.getUTCMonth();
  var premier = new Date(Date.UTC(an, mo, 1));
  var nbJours = new Date(Date.UTC(an, mo + 1, 0)).getUTCDate();
  var decal = (premier.getUTCDay() + 6) % 7; // lundi en premier

  var bks = (AG.bks || []).filter(function (b) { return ["pending", "confirmed"].indexOf(b.status) >= 0; });
  var parJour = {};
  bks.forEach(function (b) { var k = String(b.start_at).slice(0, 10); (parJour[k] = parJour[k] || []).push(b); });

  var cells = "";
  for (var i = 0; i < decal; i++) cells += '<div class="agc vide"></div>';
  for (var d = 1; d <= nbJours; d++) {
    var ymd = agYmd(new Date(Date.UTC(an, mo, d)));
    var n2 = (parJour[ymd] || []).length;
    var estAuj = ymd === agYmd(agToday());
    cells += '<button class="agc' + (AG.jour === ymd ? " on" : "") + (estAuj ? " auj" : "") + '" onclick="agPick(\'' + ymd + '\')">'
      + "<b>" + d + "</b>" + (n2 ? '<span class="agdot">' + n2 + "</span>" : "") + "</button>";
  }

  setView('<div class="card"><div class="between">'
    + '<button class="btn sm sec" onclick="agShift(-1)">‹</button>'
    + "<h3>" + MOIS_FR[mo] + " " + an + "</h3>"
    + '<button class="btn sm sec" onclick="agShift(1)">›</button></div>'
    + '<div class="agdow">' + ["L", "M", "M", "J", "V", "S", "D"].map(function (x) { return "<span>" + x + "</span>"; }).join("") + "</div>"
    + '<div class="aggrid">' + cells + "</div></div>"
    + '<div id="agday"></div>');
  if (AG.jour) agRenderJour();
}
function agShift(n) {
  AG.mois = new Date(Date.UTC(AG.mois.getUTCFullYear(), AG.mois.getUTCMonth() + n, 1));
  AG.jour = null; AG.slots = null; vAgenda();
}
function agPick(ymd) { AG.jour = ymd; AG.slots = null; vAgenda(); agLoadSlots(); }

/* Créneaux libres : on réutilise l'edge function publique slots, celle-là
   même qui alimente le site. Une seule règle de disponibilité, donc jamais
   de divergence entre ce que voit le gérant et ce que voit la cliente. */
async function agLoadSlots() {
  var svc = AG.svcId || ((DATA.services || [])[0] || {}).id;
  if (!svc) return;
  try {
    var r = await fetch(_SUPA + "/functions/v1/slots", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ service_id: svc, days: 60 }),
    });
    var j = await r.json().catch(function () { return {}; });
    var jour = (j.days || []).filter(function (x) { return x.date === AG.jour; })[0];
    AG.slots = jour ? jour.slots : [];
  } catch (e) { AG.slots = null; }
  agRenderJour();
}

function agRenderJour() {
  var el = document.getElementById("agday"); if (!el || !AG.jour) return;
  var bks = (AG.bks || [])
    .filter(function (b) { return String(b.start_at).slice(0, 10) === AG.jour && ["pending", "confirmed"].indexOf(b.status) >= 0; })
    .sort(function (a, b) { return a.start_at < b.start_at ? -1 : 1; });

    ? bks.map(function (b) {

    : '<div class="tag">Aucun rendez-vous ce jour.</div>';

        ? '<div class="agslots">' + AG.slots.map(function (s) { return '<span class="agslot">' + s.t + "</span>"; }).join("") + "</div>"
        : '<div class="tag">Aucun créneau libre ce jour.</div>');

  el.innerHTML = '<div class="card"><div class="between"><h3>' + AG.jour.split("-").reverse().join("/") + "</h3>"
    + '<button class="btn sm sec" onclick="agBlockSheet()">Bloquer</button></div>'
    + '<div class="list" style="margin-top:8px">' + listeRdv + "</div></div>"
    + '<div class="card"><h3>Créneaux encore libres</h3>' + libres
    + '<div class="tag" style="margin-top:8px">Calculés avec les mêmes règles que le site : horaires, fermetures, blocages et rendez-vous.</div></div>';
}

function agBlockSheet() {
  sheet('<div class="hd"><h3>Bloquer un créneau</h3><button class="x" onclick="closeSheet(this)">×</button></div>'
    + '<div class="card"><div class="tag">' + AG.jour.split("-").reverse().join("/") + "</div>"

    + '<button class="btn" onclick="agBlockGo(this)">Bloquer</button></div></div>');
}

  btn.disabled = true; btn.textContent = "Blocage…";

function ldDate(iso) {

function ldEsc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* Ouverture de la page : marque tout comme vu, la pastille retombe. */
